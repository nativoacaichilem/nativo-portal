<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Producción nativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Pensado para alguien que no es de computadores, con guantes, en
   una bodega fría y con una mano ocupada.

   Las reglas que explican todo lo que sigue:
     · Una sola tarea en pantalla. Nunca dos caminos a la vez.
     · Nada baja de 17px. Los botones, nunca de 58px de alto.
     · Los números se suben y bajan con botones, no tecleando.
     · Siempre hay un "Volver" grande y en el mismo lugar.
     · Ninguna palabra de sistema: no existe "medida", "merma" ni
       "propuesta". Existe "cajas", "se echó a perder" y "lo mandé".
   ══════════════════════════════════════════════════════════════ */
:root{
  --mora:#6b35b8;--mora-d:#4a1f7a;--mora-xl:#f0e6ff;
  --am:#f5c842;
  --crema:#fdf8f0;--crema-d:#e6ddd0;
  --text:#1e1226;--textl:#7d6e8e;--white:#fff;
  --verde:#15803d;--verde-l:#d6f5e3;
  --rojo:#b91c1c;--rojo-l:#fee2e2;
  --naranjo:#c2410c;--naranjo-l:#ffedd5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#f4f1fa;color:var(--text);
  font-size:17px;font-weight:700;min-height:100vh;padding-bottom:30px}

input,select{width:100%;padding:16px;border:2px solid var(--crema-d);border-radius:14px;
  font-size:18px;font-family:'Nunito',sans-serif;font-weight:800;background:var(--white);
  color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--mora)}
label{display:block;font-size:15px;font-weight:900;color:var(--textl);margin-bottom:7px}

.b{display:block;width:100%;border:none;border-radius:16px;padding:19px;font-size:19px;
  font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;min-height:62px;
  margin-bottom:12px;line-height:1.3}
.b-mora{background:var(--mora);color:#fff}
.b-verde{background:var(--verde);color:#fff}
.b-am{background:var(--am);color:var(--mora-d)}
.b-gris{background:var(--white);color:var(--textl);border:2px solid var(--crema-d)}
.b:disabled{opacity:.45}
.b-chico{font-size:16px;padding:14px;min-height:52px;margin-bottom:0}

.barra{background:var(--mora);color:#fff;padding:14px 16px;display:flex;gap:12px;
  align-items:center;position:sticky;top:0;z-index:30}
.barra .quien{flex:1;min-width:0;font-size:15px;font-weight:900;line-height:1.3;
  overflow:hidden}
.barra .quien small{display:block;font-size:13px;font-weight:700;opacity:.75}
.barra button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:11px;
  padding:12px 15px;font-weight:900;font-size:15px;font-family:'Nunito',sans-serif;
  cursor:pointer;min-height:46px}

.caja{max-width:620px;margin:0 auto;padding:16px}
.p{display:none}.p.on{display:block}
.tarj{background:var(--white);border-radius:18px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(107,53,184,.09)}
h1{font-size:23px;font-weight:900;line-height:1.25;margin-bottom:6px}
h2{font-size:19px;font-weight:900;line-height:1.3;margin-bottom:4px}
.gris{color:var(--textl);font-size:15px;font-weight:700;line-height:1.5}

.aviso{padding:16px;border-radius:14px;font-size:16px;font-weight:800;line-height:1.5;
  margin-bottom:14px}
.a-rojo{background:var(--rojo-l);color:var(--rojo)}
.a-verde{background:var(--verde-l);color:var(--verde)}
.a-mora{background:var(--mora-xl);color:var(--mora-d)}
.a-naranjo{background:var(--naranjo-l);color:var(--naranjo)}

/* ── CONTADOR ──
   El número se sube y se baja con botones. Tecleando en un teléfono con
   guantes se equivoca cualquiera, y un 5 que queda en 55 descuadra la bodega
   sin que nadie lo note hasta el conteo siguiente. */
.cont{display:flex;gap:12px;align-items:center;margin:14px 0}
.cont button{width:68px;height:68px;flex:0 0 68px;border:none;border-radius:18px;
  background:var(--mora-xl);color:var(--mora-d);font-size:32px;font-weight:900;
  cursor:pointer;font-family:'Nunito',sans-serif;line-height:1}
.cont button:active{background:var(--mora);color:#fff}
.cont input{flex:1;text-align:center;font-size:34px;font-weight:900;padding:12px;
  min-width:0}

.fila{display:flex;gap:12px;align-items:center;padding:14px 0;
  border-bottom:2px solid var(--crema)}
.fila:last-child{border-bottom:none}
.fila-n{flex:1;min-width:0;font-size:17px;font-weight:800;line-height:1.3}
.fila-c{font-size:21px;font-weight:900;flex:0 0 auto}

.marca{display:inline-block;padding:5px 12px;border-radius:20px;font-size:13px;
  font-weight:900;margin-left:4px}
.m-verde{background:var(--verde-l);color:var(--verde)}
.m-naranjo{background:var(--naranjo-l);color:var(--naranjo)}
.m-rojo{background:var(--rojo);color:#fff}
.m-gris{background:var(--crema);color:var(--textl)}

.pistola{background:var(--mora-xl);border-radius:16px;padding:14px;margin-bottom:14px}
.pistola input{font-size:21px;text-align:center;letter-spacing:1px}
.pistola.ok input{border-color:var(--verde);background:var(--verde-l)}
.pistola.mal input{border-color:var(--rojo);background:var(--rojo-l)}

.paso{font-size:15px;font-weight:900;color:var(--textl);margin-bottom:10px}
.sp{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.3);
  border-top-color:currentColor;border-radius:50%;animation:g .7s linear infinite;
  margin-right:9px;vertical-align:-3px}
@keyframes g{to{transform:rotate(360deg)}}

/* La pantalla de listo ocupa todo y se va sola. Es la que le dice que puede
   soltar el teléfono y seguir trabajando. */
#listo{display:none;position:fixed;inset:0;background:var(--verde);color:#fff;
  z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:30px;
  text-align:center}
#listo.on{display:flex}
#listo .tic{font-size:76px;line-height:1;margin-bottom:14px}
#listo .txt{font-size:25px;font-weight:900;line-height:1.3}
#listo .sub{font-size:17px;font-weight:700;opacity:.9;margin-top:12px;line-height:1.5}

<style>
/* Propio de producción: la tarjeta de un lote, que es lo que más se mira. */
.lote{background:var(--white);border:2px solid var(--crema-d);border-radius:14px;
  padding:14px;margin-bottom:10px}
.lote.espera{border-color:var(--am)}
.lote.listo{border-color:var(--verde);background:#f4fdf8}
.turno{display:inline-block;padding:4px 11px;border-radius:20px;font-size:13px;
  font-weight:900;background:var(--mora-xl);color:var(--mora-d)}
.dif{background:var(--naranjo-l);color:var(--naranjo);border-radius:10px;
  padding:9px 11px;margin-top:8px;font-size:14px;font-weight:800;line-height:1.45}
</style>
</head>
<body>

<!-- ══ ENTRAR ══ -->
<div id="p-login" class="p on">
  <div class="caja" style="padding-top:40px">
    <h1 style="text-align:center;font-size:30px;color:var(--mora-d)">Producción</h1>
    <div class="gris" style="text-align:center;margin-bottom:24px">nativo</div>
    <div class="tarj">
      <div id="login-aviso"></div>
      <div style="margin-bottom:16px">
        <label>Tu nombre</label>
        <input id="in-nombre" type="text" placeholder="Para saber quién anotó" maxlength="40">
      </div>
      <div style="margin-bottom:18px">
        <label>Clave</label>
        <input id="in-clave" type="password" inputmode="numeric" placeholder="Clave"
          onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <button class="b b-am" id="b-entrar" onclick="entrar()">Entrar</button>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="barra">
    <div class="quien" id="barra-quien">—</div>
    <button onclick="irInicio()">Inicio</button>
  </div>

  <div class="caja">
    <div id="aviso-global"></div>

    <!-- ── INICIO ── -->
    <div id="p-inicio" class="p on">
      <h1>Hola <span id="hola-nombre"></span></h1>
      <div class="gris" style="margin-bottom:18px">¿Qué vas a hacer?</div>

      <button class="b b-verde" onclick="abrirProduje()">
        🏭 Produje algo<br><small style="font-size:15px;font-weight:700;opacity:.85"
        >Anotar lo que hice y cuándo lo retiran</small></button>

      <button class="b b-mora" onclick="abrirPedir()">
        📦 Necesito materia prima<br><small style="font-size:15px;font-weight:700;opacity:.85"
        >Pedir lo que me falta para producir</small></button>

      <button class="b b-gris" onclick="abrirHistorial()">
        📋 Lo que he hecho<br><small style="font-size:15px;font-weight:700"
        id="res-hist">—</small></button>
    </div>

    <!-- ── PRODUJE ── -->
    <div id="p-produje" class="p">
      <div class="paso">Produje algo</div>
      <div id="prod-aviso"></div>
      <div class="tarj">
        <div style="margin-bottom:16px">
          <label>¿Qué produjiste?</label>
          <select id="pr-producto" onchange="prProductoCambio()"></select>
        </div>

        <div id="pr-nuevo-caja" style="display:none;margin-bottom:16px">
          <label>Nombre exacto del producto nuevo</label>
          <input id="pr-nuevo" type="text" placeholder="Escríbelo completo y bien"
            oninput="prBuscarParecido()">
          <div class="gris" id="pr-parecido" style="margin-top:7px"></div>
          <div style="display:flex;gap:10px;margin-top:10px">
            <div style="flex:1"><label>Formato</label>
              <input id="pr-formato" type="text" placeholder="Ej: 3,6 L"></div>
            <div style="flex:1"><label>Unidad</label>
              <select id="pr-unidad">
                <option value="un">Unidades</option>
                <option value="kg">Kilos</option>
                <option value="lt">Litros</option>
              </select></div>
          </div>
        </div>

        <label id="pr-lbl">¿Cuánto hiciste?</label>
        <div class="cont">
          <button onclick="sumar('pr-cant',-1)">−</button>
          <input id="pr-cant" type="number" inputmode="numeric" value="0" onfocus="this.select()">
          <button onclick="sumar('pr-cant',1)">+</button>
        </div>

        <label>¿Qué día lo retiran?</label>
        <input id="pr-fecha" type="date" style="margin-bottom:14px">

        <label>¿En qué momento?</label>
        <div style="display:flex;gap:10px;margin-bottom:16px">
          <button class="b b-gris" id="pr-t1" style="flex:1" onclick="prTurno('manana')">
            ☀️ Mañana</button>
          <button class="b b-gris" id="pr-t2" style="flex:1" onclick="prTurno('tarde')">
            🌙 Tarde</button>
        </div>

        <div style="margin-bottom:16px">
          <label>¿Algo que avisar?</label>
          <input id="pr-nota" type="text" placeholder="Opcional">
        </div>

        <button class="b b-verde" id="b-produje" onclick="guardarLote()">
          Anotar</button>
      </div>
      <button class="b b-gris" onclick="irInicio()">← Volver</button>
    </div>

    <!-- ── PEDIR MATERIA PRIMA ── -->
    <div id="p-pedir" class="p">
      <div class="paso">Necesito materia prima</div>
      <div id="ped-aviso"></div>
      <div class="tarj">
        <label>¿Qué necesitas?</label>
        <div id="ped-lista" style="margin-bottom:14px"></div>

        <label>¿Qué día lo necesitas?</label>
        <input id="ped-fecha" type="date" style="margin-bottom:14px">

        <label>¿En qué momento?</label>
        <div class="gris" style="margin:-4px 0 8px">
          El freezer es chico: si llega cuando no corresponde, no cabe.
        </div>
        <div style="display:flex;gap:10px;margin-bottom:16px">
          <button class="b b-gris" id="ped-t1" style="flex:1" onclick="pedTurno('manana')">
            ☀️ Mañana</button>
          <button class="b b-gris" id="ped-t2" style="flex:1" onclick="pedTurno('tarde')">
            🌙 Tarde</button>
        </div>

        <div style="margin-bottom:16px">
          <label>¿Algo más?</label>
          <input id="ped-nota" type="text" placeholder="Opcional">
        </div>

        <button class="b b-mora" id="b-pedir" onclick="guardarPedido()">
          Mandar el pedido</button>
      </div>
      <button class="b b-gris" onclick="irInicio()">← Volver</button>
    </div>

    <!-- ── HISTORIAL ── -->
    <div id="p-hist" class="p">
      <div class="paso">Lo que he hecho</div>
      <div id="hist-lista"></div>
      <button class="b b-gris" onclick="irInicio()">← Volver</button>
    </div>
  </div>
</div>

<div id="listo">
  <div class="tic">✔</div>
  <div class="txt" id="listo-txt">Listo</div>
  <div class="sub" id="listo-sub"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  produccion.html — la sala de producción
//
//  Dos cosas: anotar lo que fabricó y pedir la materia prima que necesita.
//
//  ══ EL TRASPASO ══
//
//  Un lote lo declara producción y lo recibe la oficina. Entre esos dos
//  momentos el número puede cambiar: se cae un balde cargando, descargando o
//  en el viaje. Esa diferencia —declarado contra recibido— es el dato que
//  dice cuánto se pierde en el traspaso.
//
//  Producción puede corregir su lote MIENTRAS nadie lo retire. Después no:
//  el número lo confirmó quien lo recibió. Si pudiera editarlo después,
//  declararía cualquier cosa y lo ajustaría al final, y la diferencia —que es
//  lo único que importa— sería siempre cero.
//
//  Eso no lo impide esta pantalla: lo impide el Worker. Una pantalla se
//  saltea con la consola del navegador en diez segundos.
//
//  ══ EL TURNO NO ES OPCIONAL ══
//
//  La sala tiene un freezer chico donde conviven la materia prima y lo
//  producido. Cuándo llega importa tanto como qué llega, así que se pregunta
//  siempre y no se deja en blanco.
// ══════════════════════════════════════════════════════════════

const PROXY = 'https://nativo-proxy.mkitzing.workers.dev';
let TOKEN = '', quien = '';
let productos = [], lotes = [], pedidos = [];
let prTurnoSel = '', pedTurnoSel = '', pedCant = {};

// ── red ───────────────────────────────────────────────────────
function explicarRed(e) {
  const m = String(e && e.message || e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'No hay señal. Acércate a donde llegue internet y vuelve a intentar.';
  return m;
}
async function pedir(url, o) {
  try { return await fetch(url, o); }
  catch (e) { throw new Error(explicarRed(e)); }
}
const cab = c => c ? { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json' }
                   : { 'X-Admin-Token': TOKEN };
function revisarAuth(r) {
  if (r.status === 401) {
    TOKEN = '';
    try { sessionStorage.removeItem('nativo_pro_token'); } catch (_) {}
    document.getElementById('app').style.display = 'none';
    document.getElementById('p-login').style.display = 'block';
    mostrar('p-login');
    av('login-aviso', 'La sesión se cerró. Entra de nuevo.', 'rojo');
    throw new Error('Sesión cerrada');
  }
  return r;
}
async function leer(path) {
  const r = revisarAuth(await pedir(`${PROXY}/supabase/${path}`, { headers: cab(false) }));
  if (!r.ok) throw new Error('HTTP ' + r.status + ' en ' + path.split('?')[0]);
  const d = await r.json();
  if (!Array.isArray(d)) throw new Error('Respuesta rara del servidor');
  return d;
}
async function enviar(tabla, metodo, filas) {
  const r = revisarAuth(await pedir(`${PROXY}/supabase/${tabla}`,
    { method: metodo, headers: cab(true), body: JSON.stringify(filas) }));
  if (!r.ok) {
    let d = ''; try { d = (await r.text()).slice(0, 180); } catch (_) {}
    throw new Error(`HTTP ${r.status}${d ? ' · ' + d : ''}`);
  }
  return r;
}

// ── utilidades ────────────────────────────────────────────────
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = v => {
  const n = Number(v) || 0;
  return Number.isInteger(n) ? n.toLocaleString('es-CL')
    : n.toLocaleString('es-CL', { maximumFractionDigits: 2 });
};
const normTxt = t => String(t || '').toLowerCase().trim()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const fechaCorta = f => String(f || '').slice(0,10).split('-').reverse().join('-');
function av(id, msg, color) {
  const e = document.getElementById(id);
  if (e) e.innerHTML = msg ? `<div class="aviso a-${color || 'mora'}">${msg}</div>` : '';
}
function mostrar(id) {
  document.querySelectorAll('.p').forEach(p => p.classList.remove('on'));
  const e = document.getElementById(id);
  if (e) e.classList.add('on');
  window.scrollTo({ top: 0 });
}
function listo(txt, sub, luego) {
  document.getElementById('listo-txt').textContent = txt;
  document.getElementById('listo-sub').textContent = sub || '';
  const c = document.getElementById('listo');
  c.classList.add('on');
  setTimeout(() => { c.classList.remove('on'); if (luego) luego(); }, 1700);
}
function sumar(id, cuanto) {
  const e = document.getElementById(id);
  e.value = Math.max(0, (Number(e.value) || 0) + cuanto);
}
const prod = id => productos.find(p => String(p.id) === String(id)) || null;

// Lo que la sala puede producir. La materia prima NO se filtra por esto: lo
// que entra a la sala puede ser cualquier cosa, lo que sale de ella es
// congelado.
const congelados = () => productos.filter(p => p.congelado);
function nombreProd(id) {
  const p = prod(id);
  if (!p) return 'producto ' + id;
  return p.nombre + (p.formato ? ' (' + p.formato + ')' : '');
}

// ══════════════════════════════════════════════════════════════
//  ENTRAR
// ══════════════════════════════════════════════════════════════
async function entrar() {
  const nombre = document.getElementById('in-nombre').value.trim().slice(0, 40);
  let guardada = '';
  try { guardada = sessionStorage.getItem('nativo_pro_token') || ''; } catch (_) {}
  const clave = document.getElementById('in-clave').value || guardada;
  const btn = document.getElementById('b-entrar');

  if (!nombre) return av('login-aviso', 'Escribe tu nombre.', 'rojo');
  if (!clave)  return av('login-aviso', 'Falta la clave.', 'rojo');

  btn.innerHTML = '<span class="sp"></span>Entrando...'; btn.disabled = true;
  av('login-aviso', '');
  try {
    TOKEN = clave;
    // Si la clave es de otro portal, se manda a donde corresponde en vez de
    // dejarlo acá preguntándose por qué no ve lo suyo.
    try {
      const rr = await pedir(`${PROXY}/rol`, { headers: cab(false) });
      if (rr.ok) {
        const rol = (await rr.json()).rol;
        if (rol === 'admin')  { location.href = 'admin.html#pedidos'; return; }
        if (rol === 'bodega') { location.href = 'bodeguero.html'; return; }
      }
      if (rr.status === 401) {
        TOKEN = '';
        try { sessionStorage.removeItem('nativo_pro_token'); } catch (_) {}
        av('login-aviso', 'La clave no es correcta.', 'rojo');
        btn.innerHTML = 'Entrar'; btn.disabled = false; return;
      }
      if (rr.status === 429) {
        TOKEN = '';
        av('login-aviso', 'Probaste muchas veces. Espera quince minutos.', 'rojo');
        btn.innerHTML = 'Entrar'; btn.disabled = false; return;
      }
    } catch (_) { /* sin /rol se sigue igual */ }

    await leer('bod_productos?select=id&limit=1');
    quien = nombre;
    try {
      sessionStorage.setItem('nativo_pro_token', clave);
      localStorage.setItem('nativo_pro_quien', nombre);
    } catch (_) {}
    document.getElementById('in-clave').value = '';
    document.getElementById('p-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    arrancar();
  } catch (e) {
    TOKEN = '';
    av('login-aviso', esc(explicarRed(e)), 'rojo');
  }
  btn.innerHTML = 'Entrar'; btn.disabled = false;
}

function arrancar() {
  document.getElementById('barra-quien').textContent = quien;
  document.getElementById('hola-nombre').textContent = quien;
  cargarTodo();
}

function irInicio() { mostrar('p-inicio'); cargarTodo(); }

async function cargarTodo() {
  try {
    productos = (await leer('bod_productos?select=*&order=nombre.asc'))
      .filter(p => p.activo);
    lotes = await leer('prod_lotes?select=*&order=id.desc&limit=60');
    pedidos = await leer('pedidos?select=*&tipo=eq.produccion&order=id.desc&limit=40');

    const esperando = lotes.filter(l => l.estado === 'declarado').length;
    document.getElementById('res-hist').textContent = esperando
      ? `${esperando} esperando retiro` : 'Nada esperando retiro';
    av('aviso-global', '');
  } catch (e) {
    av('aviso-global', '<b>No se pudieron cargar los datos.</b><br>' + esc(e.message), 'rojo');
  }
}

// ══════════════════════════════════════════════════════════════
//  PRODUJE ALGO
// ══════════════════════════════════════════════════════════════
function abrirProduje() {
  mostrar('p-produje');
  const sel = document.getElementById('pr-producto');
  // Solo congelados: es lo único que fabrica la sala, y mostrarle los
  // cuarenta productos lo obliga a buscar entre cosas que nunca va a
  // producir. Un producto nuevo creado desde acá nace congelado.
  sel.innerHTML = '<option value="">— Elige qué produjiste —</option>' +
    congelados().map(p => `<option value="${p.id}">${esc(p.nombre)}` +
      `${p.formato ? ' · ' + esc(p.formato) : ''}${p.revisar ? ' (por revisar)' : ''}</option>`).join('') +
    '<option value="NUEVO">➕ Es un producto nuevo</option>';
  sel.value = '';
  document.getElementById('pr-cant').value = 0;
  document.getElementById('pr-nota').value = '';
  document.getElementById('pr-nuevo').value = '';
  document.getElementById('pr-formato').value = '';
  document.getElementById('pr-nuevo-caja').style.display = 'none';
  document.getElementById('pr-fecha').value = hoyISO();
  prTurno('');
  // Si no hay congelados, la lista sale con un solo elemento y nadie entiende
  // por qué. Más vale decirlo que dejarlo mudo.
  av('prod-aviso', congelados().length ? '' :
    'No hay productos congelados en el catálogo. Puedes crear uno nuevo acá, ' +
    'o pedirle a la oficina que marque los que correspondan.', 'naranjo');
}

function prProductoCambio() {
  const v = document.getElementById('pr-producto').value;
  document.getElementById('pr-nuevo-caja').style.display = v === 'NUEVO' ? 'block' : 'none';
  const p = prod(v);
  const f = p && Number(p.unidades_caja) > 1 ? Number(p.unidades_caja) : 1;
  document.getElementById('pr-lbl').textContent =
    f > 1 ? `¿Cuántas cajas hiciste? (cada una trae ${f})` : '¿Cuánto hiciste?';
  if (v === 'NUEVO') setTimeout(() => document.getElementById('pr-nuevo').focus(), 50);
}

// Avisa si el nombre nuevo se parece a uno que ya existe.
//
// POR QUÉ IMPORTA: el catálogo vive en cuatro lugares y admin busca el
// producto POR NOMBRE para descargar stock de un pedido. "Maracuyá" contra
// "Maracuya" no calza, el pedido se despacha y el stock no se descuenta. Eso
// es un balde desaparecido, que es justo lo que se quiere evitar.
function prBuscarParecido() {
  const v = normTxt(document.getElementById('pr-nuevo').value);
  const caja = document.getElementById('pr-parecido');
  if (v.length < 4) { caja.innerHTML = ''; return; }
  // Se busca en el catálogo COMPLETO, no solo en congelados: un nombre nuevo
  // no debe chocar con ninguno existente, porque el panel descarga stock
  // buscando por nombre y dos productos parecidos rompen ese cruce.
  const cerca = productos.filter(p => {
    const n = normTxt(p.nombre);
    return n.includes(v) || v.includes(n);
  }).slice(0, 4);
  caja.innerHTML = cerca.length
    ? '<b style="color:var(--naranjo)">Ya existe algo parecido:</b><br>' +
      cerca.map(p => `· ${esc(p.nombre)}${p.formato ? ' · ' + esc(p.formato) : ''}`).join('<br>') +
      '<br><span style="font-weight:700">Si es el mismo, elígelo arriba en vez de crearlo de nuevo.</span>'
    : '<span style="color:var(--verde);font-weight:800">✔ No se parece a ninguno existente.</span>';
}

function prTurno(t) {
  prTurnoSel = t;
  document.getElementById('pr-t1').className = 'b ' + (t === 'manana' ? 'b-mora' : 'b-gris');
  document.getElementById('pr-t2').className = 'b ' + (t === 'tarde'  ? 'b-mora' : 'b-gris');
}

async function guardarLote() {
  const sel = document.getElementById('pr-producto').value;
  const cant = Number(document.getElementById('pr-cant').value) || 0;
  const fecha = document.getElementById('pr-fecha').value;

  if (!sel)        return av('prod-aviso', 'Elige qué produjiste.', 'rojo');
  if (!(cant > 0)) return av('prod-aviso', 'Pon cuánto hiciste.', 'rojo');
  if (!fecha)      return av('prod-aviso', 'Pon qué día lo retiran.', 'rojo');
  if (!prTurnoSel) return av('prod-aviso',
    'Elige si lo retiran en la mañana o en la tarde: el freezer es chico y hay ' +
    'que saber cuándo liberar espacio.', 'rojo');

  const btn = document.getElementById('b-produje');
  btn.innerHTML = '<span class="sp"></span>Guardando...'; btn.disabled = true;
  try {
    let prodId = sel;
    if (sel === 'NUEVO') {
      const nombre = document.getElementById('pr-nuevo').value.trim();
      if (!nombre) {
        av('prod-aviso', 'Escribe el nombre del producto nuevo.', 'rojo');
        btn.innerHTML = 'Anotar'; btn.disabled = false; return;
      }
      // Nace marcado para revisión: el nombre es la llave que une producción,
      // bodega y pedidos. La oficina lo revisa antes de publicarlo.
      const r = await enviar('bod_productos', 'POST', [{
        nombre, formato: document.getElementById('pr-formato').value.trim() || null,
        unidad: document.getElementById('pr-unidad').value,
        unidades_caja: 1, congelado: true, activo: true, revisar: true
      }]);
      const d = await r.json();
      prodId = (Array.isArray(d) ? d[0] : d).id;
      if (!prodId) throw new Error('no se pudo crear el producto');
    }

    await enviar('prod_lotes', 'POST', [{
      producto_id: Number(prodId), declarada: cant, medida: 'caja',
      fecha_retiro: fecha, turno: prTurnoSel,
      nota: document.getElementById('pr-nota').value.trim(), quien
    }]);
    await cargarTodo();
    listo('Anotado', 'Lo van a retirar el ' + fechaCorta(fecha), () => abrirProduje());
  } catch (e) {
    av('prod-aviso', '<b>No se pudo guardar.</b> ' + esc(e.message) +
      '<br>Nada quedó anotado: revisa y prueba otra vez.', 'rojo');
  }
  btn.innerHTML = 'Anotar'; btn.disabled = false;
}

// ══════════════════════════════════════════════════════════════
//  PEDIR MATERIA PRIMA
// ══════════════════════════════════════════════════════════════
//
// Un pedido de materia prima es una entrega a la sala: mismo día, mismo
// turno, misma ruta, mismo descargo de bodega. Por eso es un `pedido` y no
// una tabla propia: inventarle una sería mantener dos veces lo mismo y tener
// que mirar dos listas para armar un viaje.
function abrirPedir() {
  mostrar('p-pedir');
  pedCant = {};
  document.getElementById('ped-fecha').value = hoyISO();
  document.getElementById('ped-nota').value = '';
  pedTurno('');
  pintarPedLista();
  av('ped-aviso', '');
}

function pintarPedLista() {
  const cont = document.getElementById('ped-lista');
  cont.innerHTML = productos.map(p => {
    const q = pedCant[p.id] || 0;
    return `<div class="fila">
      <div class="fila-n">${esc(p.nombre)}
        ${p.formato ? `<div class="gris" style="font-size:14px">${esc(p.formato)}</div>` : ''}</div>
      <div style="display:flex;gap:8px;align-items:center;flex:0 0 auto">
        <button class="b b-gris b-chico" style="width:52px;padding:10px"
          onclick="pedChg(${p.id},-1)">−</button>
        <div class="fila-c" style="min-width:40px;text-align:center">${num(q)}</div>
        <button class="b b-gris b-chico" style="width:52px;padding:10px"
          onclick="pedChg(${p.id},1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function pedChg(id, d) {
  pedCant[id] = Math.max(0, (pedCant[id] || 0) + d);
  if (!pedCant[id]) delete pedCant[id];
  pintarPedLista();
}

function pedTurno(t) {
  pedTurnoSel = t;
  document.getElementById('ped-t1').className = 'b ' + (t === 'manana' ? 'b-mora' : 'b-gris');
  document.getElementById('ped-t2').className = 'b ' + (t === 'tarde'  ? 'b-mora' : 'b-gris');
}

async function guardarPedido() {
  const ids = Object.keys(pedCant);
  const fecha = document.getElementById('ped-fecha').value;
  if (!ids.length)   return av('ped-aviso', 'Elige al menos una cosa.', 'rojo');
  if (!fecha)        return av('ped-aviso', 'Pon qué día lo necesitas.', 'rojo');
  if (!pedTurnoSel)  return av('ped-aviso',
    'Elige mañana o tarde: el freezer es chico y si llega cuando no ' +
    'corresponde, no cabe.', 'rojo');

  // El detalle se escribe con el mismo formato que el resto de la plataforma
  // —"Nombre (formato) xN"— para que admin lo lea igual que cualquier pedido
  // al descargar bodega. Un formato propio obligaría a un lector aparte.
  const detalle = ids.map(id => {
    const p = prod(id);
    return `${p.nombre}${p.formato ? ' (' + p.formato + ')' : ''} x${pedCant[id]}`;
  }).join(', ');

  const btn = document.getElementById('b-pedir');
  btn.innerHTML = '<span class="sp"></span>Mandando...'; btn.disabled = true;
  try {
    await enviar('pedidos', 'POST', [{
      emp: 'Sala de producción',
      dir: '',
      detalle,
      tipo: 'produccion',
      turno: pedTurnoSel,
      fecha: hoyISO(),
      fecha_entrega: fecha,
      entrega: 'despacho',
      estado: 'pendiente',
      prioritario: true,
      encargado: quien,
      comentario: document.getElementById('ped-nota').value.trim()
    }]);
    await cargarTodo();
    listo('Pedido mandado', 'Lo tienes el ' + fechaCorta(fecha), () => irInicio());
  } catch (e) {
    av('ped-aviso', '<b>No se pudo mandar.</b> ' + esc(e.message) +
      '<br>Nada quedó guardado.', 'rojo');
  }
  btn.innerHTML = 'Mandar el pedido'; btn.disabled = false;
}

// ══════════════════════════════════════════════════════════════
//  LO QUE HE HECHO
// ══════════════════════════════════════════════════════════════
//
// Dos listas: lo producido y lo pedido. Un lote ya recibido muestra la
// diferencia si la hubo — es lo que permite ver, con el tiempo, cuánto se
// pierde en el traspaso y dejar de atribuirlo a la suerte.
const EST_LOTE = {
  declarado: { t: 'Esperando retiro', c: 'espera' },
  en_camino: { t: 'En camino',        c: 'espera' },
  recibido:  { t: 'Recibido',         c: 'listo'  },
  anulado:   { t: 'Anulado',          c: ''       }
};

function abrirHistorial() {
  mostrar('p-hist');
  const cont = document.getElementById('hist-lista');
  let h = '';

  if (lotes.length) {
    h += '<div class="tarj"><div class="gris" style="margin-bottom:8px">' +
      '<b>Lo que produje</b></div>' +
      lotes.slice(0, 30).map(l => {
        const e = EST_LOTE[l.estado] || EST_LOTE.declarado;
        const dif = l.recibida != null ? Number(l.recibida) - Number(l.declarada) : 0;
        return `<div class="lote ${e.c}">
          <div style="font-weight:900;font-size:17px">${esc(nombreProd(l.producto_id))}</div>
          <div class="gris" style="margin-top:3px">
            Hice <b>${num(l.declarada)}</b> ·
            <span class="turno">${l.turno === 'manana' ? '☀️ mañana' : '🌙 tarde'}
              ${esc(fechaCorta(l.fecha_retiro))}</span>
          </div>
          <div class="gris" style="margin-top:5px"><b>${esc(e.t)}</b>${
            l.recibida != null ? ` · llegaron ${num(l.recibida)}` : ''}</div>
          ${dif ? `<div class="dif">${dif < 0
              ? `Faltaron ${num(Math.abs(dif))} en el camino`
              : `Llegaron ${num(dif)} de más`}${
              l.diferencia_motivo ? ': ' + esc(l.diferencia_motivo) : ''}</div>` : ''}
          ${l.nota ? `<div class="gris" style="margin-top:5px">${esc(l.nota)}</div>` : ''}
        </div>`;
      }).join('') + '</div>';
  }

  if (pedidos.length) {
    h += '<div class="tarj"><div class="gris" style="margin-bottom:8px">' +
      '<b>Lo que pedí</b></div>' +
      pedidos.slice(0, 20).map(p => `<div class="lote">
        <div class="gris" style="font-size:15px">${esc(p.detalle || '')}</div>
        <div class="gris" style="margin-top:5px">
          <span class="turno">${p.turno === 'manana' ? '☀️ mañana' : '🌙 tarde'}
            ${esc(fechaCorta(p.fecha_entrega || p.fecha))}</span>
          · ${esc(p.estado || '')}
        </div>
      </div>`).join('') + '</div>';
  }

  cont.innerHTML = h || '<div class="tarj"><div class="gris">Todavía no has ' +
    'anotado nada.</div></div>';
}

// ── reanudar ──────────────────────────────────────────────────
(function reanudar() {
  try {
    const n = localStorage.getItem('nativo_pro_quien');
    if (n) document.getElementById('in-nombre').value = n;
    const g = sessionStorage.getItem('nativo_pro_token');
    if (g && !n) {
      document.getElementById('in-clave').placeholder = 'Ya está lista — pon tu nombre';
      av('login-aviso', 'Solo falta tu nombre.', 'mora');
      return;
    }
    if (!g || !n) return;
    TOKEN = g; quien = n;
    document.getElementById('p-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    arrancar();
  } catch (_) {}
})();
</script>
