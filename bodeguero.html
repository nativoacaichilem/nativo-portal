<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Bodega nativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Pensado para alguien que no es de computadores, con guantes, en
   una bodega fría y con una mano ocupada.

   Las reglas que explican todo lo que sigue:
     · Una sola tarea en pantalla. Nunca dos caminos a la vez.
     · Nada baja de 17px. Los botones, nunca de 58px de alto.
     · Los números se suben y bajan con botones, no tecleando.
     · Siempre hay un "Volver" grande y en el mismo lugar.
     · Ninguna palabra de sistema: no existe "medida", "merma" ni
       "propuesta". Existe "cajas", "se echó a perder" y "lo mandé".
   ══════════════════════════════════════════════════════════════ */
:root{
  --mora:#6b35b8;--mora-d:#4a1f7a;--mora-xl:#f0e6ff;
  --am:#f5c842;
  --crema:#fdf8f0;--crema-d:#e6ddd0;
  --text:#1e1226;--textl:#7d6e8e;--white:#fff;
  --verde:#15803d;--verde-l:#d6f5e3;
  --rojo:#b91c1c;--rojo-l:#fee2e2;
  --naranjo:#c2410c;--naranjo-l:#ffedd5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:#f4f1fa;color:var(--text);
  font-size:17px;font-weight:700;min-height:100vh;padding-bottom:30px}

input,select{width:100%;padding:16px;border:2px solid var(--crema-d);border-radius:14px;
  font-size:18px;font-family:'Nunito',sans-serif;font-weight:800;background:var(--white);
  color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--mora)}
label{display:block;font-size:15px;font-weight:900;color:var(--textl);margin-bottom:7px}

.b{display:block;width:100%;border:none;border-radius:16px;padding:19px;font-size:19px;
  font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;min-height:62px;
  margin-bottom:12px;line-height:1.3}
.b-mora{background:var(--mora);color:#fff}
.b-verde{background:var(--verde);color:#fff}
.b-am{background:var(--am);color:var(--mora-d)}
.b-gris{background:var(--white);color:var(--textl);border:2px solid var(--crema-d)}
.b:disabled{opacity:.45}
.b-chico{font-size:16px;padding:14px;min-height:52px;margin-bottom:0}

.barra{background:var(--mora);color:#fff;padding:14px 16px;display:flex;gap:12px;
  align-items:center;position:sticky;top:0;z-index:30}
.barra .quien{flex:1;min-width:0;font-size:15px;font-weight:900;line-height:1.3;
  overflow:hidden}
.barra .quien small{display:block;font-size:13px;font-weight:700;opacity:.75}
.barra button{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:11px;
  padding:12px 15px;font-weight:900;font-size:15px;font-family:'Nunito',sans-serif;
  cursor:pointer;min-height:46px}

.caja{max-width:620px;margin:0 auto;padding:16px}
.p{display:none}.p.on{display:block}
.tarj{background:var(--white);border-radius:18px;padding:18px;margin-bottom:14px;
  box-shadow:0 2px 10px rgba(107,53,184,.09)}
h1{font-size:23px;font-weight:900;line-height:1.25;margin-bottom:6px}
h2{font-size:19px;font-weight:900;line-height:1.3;margin-bottom:4px}
.gris{color:var(--textl);font-size:15px;font-weight:700;line-height:1.5}

.aviso{padding:16px;border-radius:14px;font-size:16px;font-weight:800;line-height:1.5;
  margin-bottom:14px}
.a-rojo{background:var(--rojo-l);color:var(--rojo)}
.a-verde{background:var(--verde-l);color:var(--verde)}
.a-mora{background:var(--mora-xl);color:var(--mora-d)}
.a-naranjo{background:var(--naranjo-l);color:var(--naranjo)}

/* ── CONTADOR ──
   El número se sube y se baja con botones. Tecleando en un teléfono con
   guantes se equivoca cualquiera, y un 5 que queda en 55 descuadra la bodega
   sin que nadie lo note hasta el conteo siguiente. */
.cont{display:flex;gap:12px;align-items:center;margin:14px 0}
.cont button{width:68px;height:68px;flex:0 0 68px;border:none;border-radius:18px;
  background:var(--mora-xl);color:var(--mora-d);font-size:32px;font-weight:900;
  cursor:pointer;font-family:'Nunito',sans-serif;line-height:1}
.cont button:active{background:var(--mora);color:#fff}
.cont input{flex:1;text-align:center;font-size:34px;font-weight:900;padding:12px;
  min-width:0}

.fila{display:flex;gap:12px;align-items:center;padding:14px 0;
  border-bottom:2px solid var(--crema)}
.fila:last-child{border-bottom:none}
.fila-n{flex:1;min-width:0;font-size:17px;font-weight:800;line-height:1.3}
.fila-c{font-size:21px;font-weight:900;flex:0 0 auto}

.marca{display:inline-block;padding:5px 12px;border-radius:20px;font-size:13px;
  font-weight:900;margin-left:4px}
.m-verde{background:var(--verde-l);color:var(--verde)}
.m-naranjo{background:var(--naranjo-l);color:var(--naranjo)}
.m-rojo{background:var(--rojo);color:#fff}
.m-gris{background:var(--crema);color:var(--textl)}

.pistola{background:var(--mora-xl);border-radius:16px;padding:14px;margin-bottom:14px}
.pistola input{font-size:21px;text-align:center;letter-spacing:1px}
.pistola.ok input{border-color:var(--verde);background:var(--verde-l)}
.pistola.mal input{border-color:var(--rojo);background:var(--rojo-l)}

.paso{font-size:15px;font-weight:900;color:var(--textl);margin-bottom:10px}
.sp{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.3);
  border-top-color:currentColor;border-radius:50%;animation:g .7s linear infinite;
  margin-right:9px;vertical-align:-3px}
@keyframes g{to{transform:rotate(360deg)}}

/* La pantalla de listo ocupa todo y se va sola. Es la que le dice que puede
   soltar el teléfono y seguir trabajando. */
#listo{display:none;position:fixed;inset:0;background:var(--verde);color:#fff;
  z-index:200;flex-direction:column;align-items:center;justify-content:center;padding:30px;
  text-align:center}
#listo.on{display:flex}
#listo .tic{font-size:76px;line-height:1;margin-bottom:14px}
#listo .txt{font-size:25px;font-weight:900;line-height:1.3}
#listo .sub{font-size:17px;font-weight:700;opacity:.9;margin-top:12px;line-height:1.5}
</style><style>
/* ── LO QUE AGREGA ESTA VERSIÓN ──
   El encargado pasó de confirmar a operar: arma rutas, lleva el stock y
   despacha. Necesita ver más cosas a la vez sin que la pantalla se llene. */

/* Una parada de la ruta. Se lee de corrido: quién, dónde, qué lleva. */
.parada{background:var(--white);border:2px solid var(--crema-d);border-radius:14px;
  padding:14px;margin-bottom:10px}
.parada.hecha{border-color:var(--verde);background:#f4fdf8}
.parada.urge{border-color:var(--am);background:#fffdf0}
.parada-n{display:inline-block;width:26px;height:26px;border-radius:50%;
  background:var(--mora);color:#fff;font-weight:900;font-size:14px;
  text-align:center;line-height:26px;margin-right:7px;flex:0 0 auto}

/* La semana, en pestañas. Siete días no caben como botones grandes, así que
   van en una tira que se desliza. */
.dias{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;
  -webkit-overflow-scrolling:touch}
.dia-b{flex:0 0 auto;background:var(--white);border:2px solid var(--crema-d);
  border-radius:13px;padding:9px 13px;font-size:15px;font-weight:900;
  color:var(--textl);cursor:pointer;font-family:'Nunito',sans-serif;
  min-height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;min-width:64px}
.dia-b small{font-size:11px;font-weight:800;opacity:.75}
.dia-b.hoy{border-color:var(--am)}
.dia-b.act{background:var(--mora);border-color:var(--mora);color:#fff}

/* Los camiones, uno al lado del otro. */
.camiones{display:flex;gap:9px;margin-bottom:12px}
.cam-b{flex:1;background:var(--white);border:2px solid var(--crema-d);
  border-radius:13px;padding:11px;font-size:15px;font-weight:900;cursor:pointer;
  font-family:'Nunito',sans-serif;color:var(--textl);min-height:62px;line-height:1.3}
.cam-b small{display:block;font-size:12px;font-weight:700;opacity:.8;margin-top:2px}
.cam-b.act{background:var(--mora);border-color:var(--mora);color:#fff}

/* Un producto en la lista de stock, con su barra de color. */
.prod-f{display:flex;gap:11px;align-items:center;padding:12px 0;
  border-bottom:2px solid var(--crema)}
.prod-f:last-child{border-bottom:none}
/* El selector de bodega, dentro de la barra morada. */
.bod-sel{display:block;margin-top:4px;background:rgba(255,255,255,.18);color:#fff;
  border:1.5px solid rgba(255,255,255,.35);border-radius:9px;padding:5px 8px;
  font-size:14px;font-weight:800;font-family:'Nunito',sans-serif;max-width:100%}
.bod-sel option{color:var(--text)}

/* La barrita de color al costado de cada producto.
   Se llamaba `.barra`, igual que la barra de arriba, y esta definición —que
   va después— le pisaba el ancho a la otra: la barra superior quedaba en 7
   píxeles en el teléfono, con el botón Actualizar cortado y sin ver quién
   entró. Dos cosas distintas con el mismo nombre. */
.semaforo{width:7px;border-radius:4px;align-self:stretch;flex:0 0 7px}
.b-rojo{background:var(--rojo)}
.b-naranjo{background:var(--naranjo)}
.b-amarillo{background:#e3c64a}
.b-verde{background:var(--verde)}
.b-gris{background:var(--crema-d)}

.chip-f{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;
  font-weight:900;background:var(--crema);color:var(--textl)}
.chip-f.on{background:var(--mora);color:#fff}

@media print{
  .barra,.tabs,.b,.dias,.camiones,#listo,.semaforo{display:none !important}
  body{background:#fff;font-size:13px}
  .parada{page-break-inside:avoid;border-color:#999;margin-bottom:8px}
  .caja{max-width:100%;padding:0}
}

/* La zona del pistoleo: es donde está la atención mientras se carga. */
.pistola{background:var(--mora-xl);border-radius:16px;padding:14px;margin-bottom:14px}
.pistola input{font-size:21px;text-align:center;letter-spacing:1px}
.pistola.ok input{border-color:var(--verde);background:var(--verde-l)}
.pistola.mal input{border-color:var(--rojo);background:var(--rojo-l)}

/* ── CLASES QUE VENÍAN DE LA VERSIÓN ANTERIOR ──
   Se perdieron al rehacer la hoja. Una clase sin definir no rompe nada
   visible: el elemento sale sin estilo, que es peor que un error porque
   nadie lo reporta. */

/* Las cuatro pestañas de abajo. */
.tabs{display:flex;gap:7px;padding:11px 14px 0;max-width:620px;margin:0 auto}
.tab{flex:1;background:var(--white);border:2px solid var(--crema-d);
  border-radius:13px;padding:11px 5px;font-size:13px;font-weight:900;
  color:var(--textl);cursor:pointer;font-family:'Nunito',sans-serif;min-height:52px}
.tab.act{background:var(--mora);border-color:var(--mora);color:#fff}

/* Los modales suben desde abajo: en un teléfono es donde está el pulgar. */
.mbg{display:none;position:fixed;inset:0;background:rgba(74,31,122,.55);z-index:100;
  justify-content:center;align-items:flex-end}
.mbg.open{display:flex}
.modal{background:var(--white);border-radius:20px 20px 0 0;padding:20px 16px 26px;
  width:100%;max-width:620px;max-height:92vh;overflow-y:auto}
.modal h3{font-size:20px;font-weight:900;color:var(--mora-d);margin-bottom:12px}

/* Lo que lleva un pedido, dentro de su parada. */
.ped-items{background:var(--mora-xl);border-radius:10px;padding:10px 12px}
.ped-item{font-size:15px;font-weight:800;color:var(--mora-d);line-height:1.7}

/* Un aviso dentro de una tarjeta. */
.dif{background:var(--naranjo-l);border-radius:10px;padding:9px 11px;margin-top:8px;
  font-size:14px;font-weight:800;color:var(--naranjo);line-height:1.45}

/* Lo que no va en la hoja impresa. */
@media print{ .noimp{display:none !important} }
</style>
<style>
/* ══ v64 · Por salir · En ruta · Cerradas · Stock ══
   Las pestañas van abajo, al alcance del pulgar. La carga y la vuelta del
   camión son pantallas aparte, con sus dos botones fijos abajo. */
.tabs.tabs-abajo{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:none;margin:0;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--white);
  border-top:2px solid var(--crema-d);gap:4px;box-shadow:0 -4px 16px rgba(30,18,38,.06)}
.tabs-abajo .tab{border:none;background:transparent;min-height:60px;padding:4px 2px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:21px;position:relative;
  border-radius:12px;line-height:1.1}
.tabs-abajo .tab span{font-size:12.5px}
.tabs-abajo .tab.act{background:var(--mora-xl);color:var(--mora)}
.tab-n{position:absolute;top:3px;left:calc(50% + 8px);background:var(--mora);color:#fff;font-size:11px;
  min-width:20px;height:20px;border-radius:99px;display:none;place-items:center;padding:0 5px;font-style:normal}
.tab-n.on{display:grid}
#app .caja{padding-bottom:112px}
body.con-accion .tabs-abajo{display:none}
.barra-accion{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--white);
  border-top:2px solid var(--crema-d);padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1.5fr;gap:10px;box-shadow:0 -6px 18px rgba(30,18,38,.08)}
.barra-accion.una{grid-template-columns:1fr}
.barra-accion .b{margin:0;min-height:60px;padding:8px 10px;font-size:17px;line-height:1.15}
.barra-accion .b small{display:block;font-size:12.5px;font-weight:700;opacity:.85}
.b-problema{background:var(--white);color:var(--rojo);border:2px solid #f3b4b4}
.vista-cab{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.vista-cab .b{width:auto;flex:0 0 auto;margin:0;padding:10px 14px;min-height:46px;font-size:15px}
.vista-cab h2{margin:0;font-size:20px;line-height:1.2}
.vista-cab .gris{font-size:14px}
.seccion-t{font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--textl);margin:6px 2px 8px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--crema);border-radius:14px;margin:12px 0}
.cifras div{padding:8px 4px;text-align:center}
.cifras div+div{border-left:2px solid var(--crema)}
.cifras b{display:block;font-size:22px;font-weight:900;line-height:1.15}
.cifras span{font-size:12.5px;color:var(--textl);font-weight:800}
.est{display:inline-block;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:900;white-space:nowrap}
.est-listo{background:var(--mora-xl);color:var(--mora-d)}
.est-mov{background:#dbeafe;color:#1e40af}
.est-ok{background:var(--verde-l);color:var(--verde)}
.est-mal{background:var(--rojo-l);color:var(--rojo)}
.ruta-cab{display:flex;align-items:center;gap:10px}
.ruta-cab h2{margin:0;font-size:20px}
.ruta-cab .est{margin-left:auto}
.parada.cargada{border-color:var(--verde);background:#f4fdf8}
.parada.fallida{border-color:#f3b4b4;background:#fffafa}
.parada.bloq{background:#faf8fc}
.marcar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.marcar .b{margin:0}
.res-linea{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-weight:900;font-size:16px}
.res-linea.ok{color:var(--verde)}
.res-linea.mal{color:var(--rojo)}
.enlace{background:none;border:none;color:var(--mora);font-weight:900;font-size:15px;padding:6px 2px;cursor:pointer;font-family:'Nunito',sans-serif}
.totales .fila-c small{font-size:13px;color:var(--textl);font-weight:800;margin-left:3px}
.opcion{display:block;width:100%;text-align:left;min-height:56px;border-radius:14px;border:2px solid var(--crema-d);
  background:var(--white);font-weight:900;font-size:17px;padding:12px 14px;margin-bottom:8px;cursor:pointer;
  font-family:'Nunito',sans-serif;color:var(--text)}
.opcion.on{border-color:var(--mora);background:var(--mora-xl);color:var(--mora-d)}
.lista-res .fila-n small{display:block;font-size:13px;color:var(--textl);font-weight:700}
@media print{ .tabs-abajo,.barra-accion{display:none !important} }
</style>
</head>
<body>

<!-- ══ ENTRAR ══ -->
<div id="p-login" class="p on">
  <div class="caja" style="padding-top:40px">
    <h1 style="text-align:center;font-size:30px;color:var(--mora-d)">Bodega</h1>
    <div class="gris" style="text-align:center;margin-bottom:24px">nativo</div>
    <div class="tarj">
      <div id="login-aviso"></div>
      <div style="margin-bottom:16px">
        <label>Tu nombre</label>
        <input id="in-nombre" type="text" placeholder="Para saber quién anotó" maxlength="40">
      </div>
      <div style="margin-bottom:18px">
        <label>Clave</label>
        <input id="in-clave" type="password" inputmode="numeric" placeholder="Clave"
          onkeydown="if(event.key==='Enter')entrar()">
      </div>
      <button class="b b-am" id="b-entrar" onclick="entrar()">Entrar</button>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div class="barra">
    <div class="quien" id="barra-quien">—</div>
    <button onclick="cargarTodo(true)">Actualizar</button>
  </div>

  <!-- v64 · Las pestañas siguen el viaje del camión: lo que está por salir,
       lo que va en la calle y lo que ya volvió. Las rutas las arma y publica
       la oficina; acá se cargan, se marca la salida y se marca la vuelta. -->
  <nav class="tabs tabs-abajo" aria-label="Secciones">
    <button class="tab act" id="t-salir" onclick="ir('salir')">🚚<span>Por salir</span><i class="tab-n" id="n-salir"></i></button>
    <button class="tab" id="t-ruta" onclick="ir('ruta')">🛣️<span>En ruta</span><i class="tab-n" id="n-ruta"></i></button>
    <button class="tab" id="t-cerradas" onclick="ir('cerradas')">✅<span>Cerradas</span></button>
    <button class="tab" id="t-stock" onclick="ir('stock')">📦<span>Stock</span></button>
  </nav>
  <div id="barra-accion"></div>

  <div class="caja">
    <div id="aviso-global"></div>

    <!-- ══ POR SALIR ══ -->
    <div id="p-salir" class="p on"><div id="salir-cont"></div></div>

    <!-- ══ EN RUTA ══ -->
    <div id="p-ruta" class="p"><div id="ruta-cont"></div></div>

    <!-- ══ CERRADAS ══ (reemplaza a «Mi día») -->
    <div id="p-cerradas" class="p"><div id="cerradas-cont"></div></div>

    <!-- ══ STOCK ══ -->
    <div id="p-stock" class="p">
      <div class="tarj">
        <h2>📦 Lo que hay</h2>
        <div class="gris">El color dice cuánto alcanza según lo que se vende.</div>
        <div style="display:flex;gap:7px;margin-top:12px;flex-wrap:wrap">
          <button class="chip-f"    id="f-frio"  onclick="filtrarStock('frio')">❄️ Congelados</button>
          <button class="chip-f"    id="f-todo"  onclick="filtrarStock('')">Todo</button>
          <button class="chip-f"    id="f-seco"  onclick="filtrarStock('seco')">El resto</button>
          <button class="chip-f"    id="f-poco"  onclick="filtrarStock('poco')">⚠️ Poco stock</button>
        </div>
        <input type="text" id="stock-q" placeholder="🔍 Buscar producto..."
          oninput="renderStock()" style="margin-top:11px">
        <button class="b b-gris b-chico" style="margin-top:11px" onclick="imprimirConteo()">
          🖨️ Imprimir hoja para contar</button>
      </div>
      <div id="stock-lista"></div>
      <div id="anote-cont"></div>
    </div>

  </div>
</div>

  </div>
</div>

<!-- ══ CARGAR AL CAMIÓN ══
     Acá se anota lo que sube. El stock se descuenta cuando se marca «Salió»:
     así un camión que no sale no deja el inventario corto. -->
<div class="mbg" id="mod-carga">
  <div class="modal">
    <h3 id="cg-title">Cargar al camión</h3>
    <div id="cg-alert"></div>
    <div id="cg-ficha" class="aviso a-mora"></div>

    <div class="pistola">

<!-- ══ HOJA DE CONFIRMACIÓN Y MOTIVOS ══ -->
<div class="mbg" id="mod-hoja" role="dialog" aria-modal="true">
  <div class="modal"><div id="hoja-cuerpo"></div></div>
</div>

<div id="listo">
  <div class="tic">✔</div>
  <div class="txt" id="listo-txt">Listo</div>
  <div class="sub" id="listo-sub"></div>
</div>
<script>
const PROXY = 'https://nativo-proxy.mkitzing.workers.dev';
let TOKEN = '', quien = '', miBodega = null;

let bodegas = [], productos = [], motivos = [], saldos = [];
let rutas = [], pedidos = [], movs = [], lotes = [];

// Qué se está mirando. El día manda: casi todo lo que hace cuelga de un día.
let diaSel = '', camionSel = 'camion-1', filtroStock = '';
let aAsignar = new Set();

// ── red ───────────────────────────────────────────────────────
function explicarRed(e) {
  const m = String(e && e.message || e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m))
    return 'No hay señal. Acércate a donde llegue internet y vuelve a intentar.';
  return m;
}
async function pedir(url, o) {
  try { return await fetch(url, o); }
  catch (e) { throw new Error(explicarRed(e)); }
}
const cab = c => c ? { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json' }
                   : { 'X-Admin-Token': TOKEN };
function revisarAuth(r) {
  if (r.status === 401) {
    TOKEN = '';
    try { sessionStorage.removeItem('nativo_bod_token'); } catch (_) {}
    document.getElementById('app').style.display = 'none';
    mostrar('p-login');
    document.getElementById('p-login').style.display = 'block';
    av('login-aviso', 'La sesión se cerró. Entra de nuevo.', 'rojo');
    throw new Error('Sesión cerrada');
  }
  return r;
}
async function leer(path) {
  const r = revisarAuth(await pedir(`${PROXY}/supabase/${path}`, { headers: cab(false) }));
  if (!r.ok) throw new Error('HTTP ' + r.status + ' en ' + path.split('?')[0]);
  const d = await r.json();
  if (!Array.isArray(d)) throw new Error('Respuesta rara del servidor');
  return d;
}
// Actualizar una fila. El rol nuevo lo exige: asignar pedidos a una ruta,
// cambiar su estado, ponerle chofer a un camión.
async function actualizar(path, filas) {
  const r = revisarAuth(await pedir(`${PROXY}/supabase/${path}`,
    { method: 'PATCH', headers: cab(true), body: JSON.stringify(filas) }));
  if (!r.ok) {
    let d = ''; try { d = (await r.text()).slice(0, 180); } catch (_) {}
    throw new Error(`HTTP ${r.status}${d ? ' · ' + d : ''}`);
  }
  return r;
}

async function crear(tabla, filas) {
  const r = revisarAuth(await pedir(`${PROXY}/supabase/${tabla}`,
    { method: 'POST', headers: cab(true), body: JSON.stringify(filas) }));
  if (!r.ok) {
    let d = ''; try { d = (await r.text()).slice(0, 180); } catch (_) {}
    throw new Error(`HTTP ${r.status}${d ? ' · ' + d : ''}`);
  }
  return r;
}

// ── utilidades ────────────────────────────────────────────────
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = v => {
  const n = Number(v) || 0;
  return Number.isInteger(n) ? n.toLocaleString('es-CL')
    : n.toLocaleString('es-CL', { maximumFractionDigits: 2 });
};
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function av(id, msg, color) {
  const e = document.getElementById(id);
  if (e) e.innerHTML = msg ? `<div class="aviso a-${color || 'mora'}">${msg}</div>` : '';
}
function mostrar(id) {
  document.querySelectorAll('.p').forEach(p => p.classList.remove('on'));
  const e = document.getElementById(id);
  if (e) e.classList.add('on');
  window.scrollTo({ top: 0 });
}
// La confirmación a pantalla completa. Es lo que le dice que puede soltar el
// teléfono: un mensaje chico arriba se pierde y deja la duda de si se guardó.
const abrir  = id => document.getElementById(id).classList.add('open');
const cerrar = id => document.getElementById(id).classList.remove('open');

function listo(txt, sub, luego) {
  document.getElementById('listo-txt').textContent = txt;
  document.getElementById('listo-sub').textContent = sub || '';
  const c = document.getElementById('listo');
  c.classList.add('on');
  setTimeout(() => { c.classList.remove('on'); if (luego) luego(); }, 1700);
}
// Sube y baja el número con botones. Nunca por debajo de cero.
function sumar(id, cuanto) {
  const e = document.getElementById(id);
  const v = Math.max(0, (Number(e.value) || 0) + cuanto);
  e.value = v;
  // Repinta lo que dependa del número, si quien usa el contador lo pidió.
  if (typeof msPrevio === 'function' && id === 'ms-cant') msPrevio();
}

// ── catálogo ──────────────────────────────────────────────────
//
// Esta conversión está escrita igual en bodega.html, admin.html, compras.html
// y en la vista bod_saldos. Se repite porque el Worker enruta tablas y no
// puede llamar funciones: no hay forma de importarla. Si cambia la regla, hay
// que cambiarla en todas.
const prod = id => productos.find(p => String(p.id) === String(id)) || null;
function factorDe(id) {
  const p = prod(id);
  const f = Number(p && p.unidades_caja) || 1;
  return f >= 1 ? Math.floor(f) : 1;
}
const aBase = (id, c, m) => (m || 'caja') === 'caja'
  ? (Number(c) || 0) * factorDe(id) : (Number(c) || 0);
function nombreProd(id) {
  const p = prod(id);
  if (!p) return 'producto ' + id;
  return p.nombre + (p.formato ? ' (' + p.formato + ')' : '');
}
const unidadDe = id => (prod(id) || {}).unidad || 'un';
function saldoDe(prodId) {
  if (!miBodega) return 0;
  const f = saldos.find(s => String(s.bodega_id) === String(miBodega.id) &&
                             String(s.producto_id) === String(prodId));
  return f ? Number(f.saldo) || 0 : 0;
}


// ══════════════════════════════════════════════════════════════
//  ENTRAR Y CARGAR
// ══════════════════════════════════════════════════════════════
//
// ══ LA REGLA QUE ORDENA TODA ESTA PANTALLA ══
//
// No es "facturado = administrable". Es por origen:
//
//   pedido de cliente FACTURADO     lo administra
//   pedido de cliente SIN facturar  solo lo ve
//   pedido de PRODUCCIÓN            lo administra, y va primero
//
// Los de producción nunca se facturan —son internos, de la sala— y son los
// que más urgen. Atarlos a la factura los dejaría fuera justo a ellos.
const ESTADOS_FACT = ['facturado', 'en-ruta', 'entregado', 'entregado-sin-facturar'];
const esProduccion = p => (p.tipo || '') === 'produccion';
const sePuedeTocar = p => esProduccion(p) || ESTADOS_FACT.includes(p.estado);

async function entrar() {
  const nombre = document.getElementById('in-nombre').value.trim().slice(0, 40);
  let guardada = '';
  try { guardada = sessionStorage.getItem('nativo_bod_token') || ''; } catch (_) {}
  const clave = document.getElementById('in-clave').value || guardada;
  const btn = document.getElementById('b-entrar');

  if (!nombre) return av('login-aviso', 'Escribe tu nombre.', 'rojo');
  if (!clave)  return av('login-aviso', 'Falta la clave.', 'rojo');

  btn.innerHTML = '<span class="sp"></span>Entrando...'; btn.disabled = true;
  av('login-aviso', '');
  try {
    TOKEN = clave;
    try {
      const rr = await pedir(`${PROXY}/rol`, { headers: cab(false) });
      if (rr.ok) {
        const rol = (await rr.json()).rol;
        // La clave de admin ENTRA a este portal, no redirige.
        //
        // Antes mandaba al panel en silencio, sin decir por qué: tecleabas
        // una clave y aparecías en otra pantalla. Admin puede hacer todo lo
        // que hace el encargado, así que entrar acá es lo menos sorpresivo y
        // sirve para ver exactamente lo que él ve.
        //
        // La de producción sí redirige: desde acá no podría hacer nada.
        if (rol === 'produccion') { location.href = 'produccion.html'; return; }
      }
      if (rr.status === 401) {
        TOKEN = '';
        try { sessionStorage.removeItem('nativo_bod_token'); } catch (_) {}
        av('login-aviso', 'La clave no es correcta.', 'rojo');
        btn.innerHTML = 'Entrar'; btn.disabled = false; return;
      }
      if (rr.status === 429) {
        TOKEN = '';
        av('login-aviso', 'Probaste muchas veces. Espera quince minutos.', 'rojo');
        btn.innerHTML = 'Entrar'; btn.disabled = false; return;
      }
    } catch (_) { /* sin /rol se sigue igual */ }

    miBodega = await buscarBodega();
    if (!miBodega) {
      TOKEN = '';
      av('login-aviso', '<b>No hay ninguna bodega activa.</b><br>' +
        'Avisa a la oficina: se crean en Bodega → Configuración.', 'rojo');
      btn.innerHTML = 'Entrar'; btn.disabled = false; return;
    }
    quien = nombre;
    try {
      sessionStorage.setItem('nativo_bod_token', clave);
      localStorage.setItem('nativo_bod_quien', nombre);
    } catch (_) {}
    document.getElementById('in-clave').value = '';
    document.getElementById('p-login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    arrancar();
  } catch (e) {
    TOKEN = '';
    av('login-aviso', esc(explicarRed(e)), 'rojo');
  }
  btn.innerHTML = 'Entrar'; btn.disabled = false;
}

// ── en qué bodega está trabajando ──
//
// El encargado maneja TODAS las bodegas: es una empresa chica y él es el
// responsable del stock. Elige en cuál está trabajando y se recuerda en su
// teléfono.
//
// Antes la fijaba la oficina en `bod_config.bodega_portal`. Si nadie la
// configuraba —y nadie lo hizo, porque el portal no se había usado— el
// encargado no podía entrar. Era el motivo por el que el portal no abría.
async function buscarBodega() {
  try {
    const bods = (await leer('bod_bodegas?select=*&order=nombre.asc')).filter(b => b.activa);
    if (!bods.length) return null;
    let guardada = '';
    try { guardada = localStorage.getItem('nativo_bod_bodega') || ''; } catch (_) {}
    return bods.find(b => String(b.id) === guardada) || bods[0];
  } catch (_) { return null; }
}

// Cambiar de bodega. Lo que se anota y lo que se ve pasa a ser de la nueva.
async function cambiarBodega(id) {
  const b = bodegas.find(x => String(x.id) === String(id));
  if (!b) return;
  miBodega = b;
  try { localStorage.setItem('nativo_bod_bodega', String(b.id)); } catch (_) {}
  pintarBarra();
  repintar();
}

function pintarBarra() {
  const sel = bodegas.filter(b => b.activa).map(b =>
    `<option value="${b.id}"${String(b.id) === String(miBodega && miBodega.id) ? ' selected' : ''}>` +
    `${esc(b.nombre)}</option>`).join('');
  document.getElementById('barra-quien').innerHTML =
    `${esc(quien)}<select class="bod-sel" onchange="cambiarBodega(this.value)"
       title="En qué bodega estás trabajando">${sel}</select>`;
}

function arrancar() {
  // El selector se pinta cuando ya están cargadas las bodegas.
  if (!diaSel) diaSel = hoyISO();
  // El stock abre en los congelados, que es lo que más se mueve.
  if (filtroStock !== 'frio') filtrarStock('frio');
  cargarTodo();
}

function ir(id) {
  vistaRuta = null;
  document.querySelectorAll('.p').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('act'));
  document.getElementById('p-' + id).classList.add('on');
  document.getElementById('t-' + id).classList.add('act');
  pintar(id);
  window.scrollTo({ top: 0 });
}
function pintar(id) {
  if (id === 'salir')    renderPorSalir();
  if (id === 'ruta')     renderEnRuta();
  if (id === 'cerradas') renderCerradas();
  if (id === 'stock')  { renderStock(); renderAnote(); }
  pintarContadores();
  pintarBarraAccion();
}
function repintar() {
  const a = document.querySelector('.tab.act');
  pintar(a ? a.id.replace('t-', '') : 'salir');
}

// El lunes de la semana que se está mirando, para la tira de días.
function lunesDe(iso) {
  const d = new Date(iso + 'T12:00:00');
  const corr = (d.getDay() + 6) % 7;     // getDay() da 0 el domingo
  d.setDate(d.getDate() - corr);
  return d;
}
const aISO = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const DIAS_C = ['dom','lun','mar','mié','jue','vie','sáb'];
const fechaCorta = f => String(f || '').slice(0,10).split('-').reverse().join('-');

// La fecha de entrega viene como texto chileno. Se traduce a ISO para poder
// comparar por día, que es como se ordena toda esta pantalla.
// El día de entrega en ISO, o '' si no tiene.
//
// Desde la migración la base lo entrega como "2026-11-03". Se entiende
// también el formato viejo —"03/11/2026"— por si este archivo sube un rato
// antes que el SQL.
//
// La versión anterior SOLO entendía el viejo: después de migrar, este portal
// no habría mostrado ni un pedido en ningún día.
function diaDe(p) {
  const v = String(p.fecha_entrega || '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
  const m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` : '';
}

async function cargarTodo(avisar) {
  try {
    const [b, pr, mo, sa] = await Promise.all([
      leer('bod_bodegas?select=*&order=nombre.asc'),
      leer('bod_productos?select=*&order=nombre.asc'),
      leer('bod_motivos?select=*&order=orden.asc'),
      leer('bod_saldos?select=bodega_id,producto_id,saldo')
    ]);
    bodegas = b; productos = pr.filter(x => x.activo); motivos = mo; saldos = sa;
    pintarBarra();

    // Las rutas de una semana para atrás y una para adelante, más cualquier
    // camión que siga en la calle aunque sea de antes.
    const [r1, r2] = await Promise.all([
      leer(`bod_rutas?select=*&fecha=gte.${sumarDias(hoyISO(), -7)}&fecha=lte.${sumarDias(hoyISO(), 7)}` +
        '&order=fecha.asc,camion.asc'),
      leer('bod_rutas?select=*&estado=eq.cargada&order=fecha.asc')
    ]);
    const vistas = new Set();
    rutas = [...r1, ...r2].filter(r => !vistas.has(r.id) && vistas.add(r.id));

    // Solo los pedidos de esas rutas: son las paradas.
    const ids = rutas.map(r => r.id);
    pedidos = ids.length
      ? await leer(`pedidos?select=*&ruta_id=in.(${ids.join(',')})&order=id.asc`) : [];

    // Los que ya descontaron stock con la forma anterior (al cargar): esos no
    // se vuelven a descontar al marcar «Salió».
    conMov = new Set();
    const pids = pedidos.map(p => p.id);
    if (pids.length) {
      const mv = await leer(`bod_movimientos?select=pedido_id,tipo&pedido_id=in.(${pids.join(',')})`);
      mv.filter(m => m.tipo === 'salida').forEach(m => conMov.add(String(m.pedido_id)));
    }
    lotes   = await leer('prod_lotes?select=*&estado=neq.recibido&order=fecha_retiro.asc');

    // Los movimientos de hoy, para el reporte del día.
    movs = await leer(`bod_movimientos?select=*&fecha=eq.${hoyISO()}&order=id.desc`);

    av('aviso-global', '');
    if (avisar) listo('Actualizado', '', null);
  } catch (e) {
    av('aviso-global', '<b>No se pudieron cargar los datos.</b><br>' +
      esc(e.message) + '<br>Revisa la señal y aprieta Actualizar.', 'rojo');
  }
  repintar();
}

// ══════════════════════════════════════════════════════════════
//  RUTAS — la semana, los dos camiones, las paradas en orden
// ══════════════════════════════════════════════════════════════
function pintarDias(contId, alElegir) {
  const cont = document.getElementById(contId);
  if (!cont) return;
  const l = lunesDe(diaSel), hoy = hoyISO();
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(l); d.setDate(d.getDate() + i);
    const iso = aISO(d);
    // Cuántos hay ese día, contando lo de producción, que es lo que más urge.
    const n = pedidos.filter(p => diaDe(p) === iso).length;
    const pro = pedidos.filter(p => diaDe(p) === iso && esProduccion(p)).length
              + lotes.filter(x => String(x.fecha_retiro).slice(0,10) === iso).length;
    h += `<button class="dia-b ${iso === diaSel ? 'act' : ''} ${iso === hoy ? 'hoy' : ''}"
            onclick="${alElegir}('${iso}')">
      ${DIAS_C[d.getDay()]} ${d.getDate()}
      <small>${n ? n + (pro ? ' · ' + pro + '🏭' : '') : '—'}</small>
    </button>`;
  }
  cont.innerHTML = `<div class="dias">${h}</div>`;
}

function verDia(iso) { diaSel = iso; cargarTodo(); }

// Lo de producción va arriba de todo y aparte.
//
// No se factura y es lo que más urge: si se mezcla con los veinte pedidos de
// clientes, se pierde. Por eso tiene su propio bloque y no una etiqueta.
function pintarUrgente() {
  const cont = document.getElementById('urgente');
  if (!cont) return;
  const pro = pedidos.filter(p => esProduccion(p) && diaDe(p) === diaSel);
  const lot = lotes.filter(x => String(x.fecha_retiro).slice(0,10) === diaSel);
  if (!pro.length && !lot.length) { cont.innerHTML = ''; return; }

  cont.innerHTML = `<div class="tarj" style="border:3px solid var(--am)">
    <h2>🏭 Producción · lo primero del día</h2>
    <div class="gris" style="margin-bottom:10px">
      Estos no llevan factura y son la prioridad.
    </div>
    ${lot.map(l => `<div class="fila">
      <div class="fila-n">📥 Retirar ${esc(nombreProd(l.producto_id))}
        <div class="gris" style="font-size:14px">
          ${num(l.declarada)} ${l.medida === 'caja' ? 'cajas' : 'un'} ·
          ${l.turno === 'manana' ? '☀️ mañana' : '🌙 tarde'}</div></div>
    </div>`).join('')}
    ${pro.map(p => `<div class="fila">
      <div class="fila-n">📦 ${esc(p.emp)}
        <div class="gris" style="font-size:14px">${esc(p.detalle || '')}
          ${p.turno ? ' · ' + (p.turno === 'manana' ? '☀️ mañana' : '🌙 tarde') : ''}</div></div>
      <button class="b b-mora b-chico" style="width:auto;flex:0 0 auto"
        onclick="verParada(${p.id})">Ver</button>
    </div>`).join('')}
  </div>`;
}

function pintarCamiones() {
  const cont = document.getElementById('camiones');
  if (!cont) return;
  let h = '';
  for (const c of ['camion-1', 'camion-2']) {
    const r = rutas.find(x => x.fecha === diaSel && x.camion === c);
    const n = r ? pedidos.filter(p => String(p.ruta_id) === String(r.id)).length : 0;
    const hechos = r ? pedidos.filter(p =>
      String(p.ruta_id) === String(r.id) && p.estado === 'entregado').length : 0;
    h += `<button class="cam-b ${c === camionSel ? 'act' : ''}" onclick="verCamion('${c}')">
      🚚 ${c === 'camion-1' ? 'Camión 1' : 'Camión 2'}
      <small>${r ? (r.chofer || 'sin chofer') : 'sin ruta'}</small>
      <small>${n ? `${hechos}/${n} entregados` : 'vacío'}</small>
    </button>`;
  }
  cont.innerHTML = `<div class="camiones">${h}</div>`;
}

function verCamion(c) { camionSel = c; renderRutas(); }

function renderRutas() {
  pintarDias('dias', 'verDia');
  pintarUrgente();
  pintarCamiones();

  const cont = document.getElementById('rutas-cont');

        Créala y después asígnale pedidos desde <b>Asignar</b>.
      </div>
      <button class="b b-mora" onclick="crearRuta('${camionSel}')">
        ＋ Crear la ruta del ${nom}</button>

    <div class="tarj">

        <div style="flex:1;min-width:150px">

function tarjetaParada(p, n) {
  const hecho = p.estado === 'entregado' || p.estado === 'entregado-sin-facturar';
  const enRuta = p.estado === 'en-ruta';
  return `<div class="parada ${hecho ? 'hecha' : ''} ${esProduccion(p) ? 'urge' : ''}">
    <div style="display:flex;gap:4px;align-items:flex-start">
      <div class="parada-n">${n}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:900;font-size:17px;line-height:1.25">${esc(p.emp)}</div>
        <div class="gris">📍 ${esc(p.dir || 'sin dirección')}</div>
        ${p.contacto || p.telefono ? `<div class="gris">👤 ${esc(p.contacto || '')}${
          p.telefono ? ' · <a href="tel:' + esc(p.telefono) + '">' + esc(p.telefono) + '</a>' : ''}</div>` : ''}
        <div class="gris">${p.factura_num
          ? '🧾 Factura ' + esc(p.factura_num)
          : esProduccion(p) ? '🏭 Producción · sin factura'
          : '<b style="color:var(--naranjo)">🧾 Sin número de factura</b>'}</div>
      </div>
    </div>

    <div class="ped-items" style="margin-top:10px">
      ${(p.detalle || '').split(/,\s*(?=[A-ZÁÉÍÓÚÑ])/).filter(Boolean)
        .map(d => `<div class="ped-item">· ${esc(d.trim())}</div>`).join('')
        || '<div class="ped-item">Sin detalle</div>'}
    </div>
    ${p.mensaje ? `<div class="dif" style="background:var(--mora-xl);color:var(--mora-d)">
      💬 ${esc(p.mensaje)}</div>` : ''}

    ${hecho ? '' : `<div style="display:flex;gap:8px;margin-top:9px" class="noimp">
      <button class="b b-gris b-chico" style="flex:1;font-size:14px"
        onclick="moverParada(${p.id})">↔ Al ${
          camionSel === 'camion-1' ? 'Camión 2' : 'Camión 1'}</button>
      ${enRuta ? '' : `<button class="b b-gris b-chico" style="flex:1;font-size:14px"
        onclick="quitarParada(${p.id})">✕ Sacar del camión</button>`}
    </div>`}

    <div style="display:flex;gap:8px;margin-top:11px" class="noimp">

        ? '<div class="gris" style="flex:1"><b>✔ Entregado</b></div>'

// ── mover y sacar paradas ──
//
// Antes, una vez asignado un pedido a un camión, no había vuelta atrás: no se
// podía pasar al otro ni sacarlo. Se reportó usándolo.
//
// MOVER se puede mientras no esté entregado: si ya se cargó, el producto va
// arriba de un camión y pasarlo al otro antes de salir es solo cambiar de
// vehículo.
//
// SACAR solo ANTES de cargar. Una vez cargado, el stock ya se descontó: sacar
// el pedido del camión dejaría el producto fuera de bodega sin ruta que lo
// explique.
async function rutaDelDia(camion) {
  let r = rutas.find(x => x.fecha === diaSel && x.camion === camion);
  if (r) return r;
  const resp = await crear('bod_rutas', [{
    fecha: diaSel, camion, bodega_id: miBodega.id, estado: 'en_bodega'
  }]);
  const d = await resp.json();
  return Array.isArray(d) ? d[0] : d;
}

async function moverParada(id) {
  const p = pedidos.find(x => String(x.id) === String(id));
  if (!p) return av('aviso-global', 'No encuentro ese pedido. Actualiza.', 'rojo');
  const otro = camionSel === 'camion-1' ? 'camion-2' : 'camion-1';
  const nom = otro === 'camion-1' ? 'Camión 1' : 'Camión 2';
  try {
    const r = await rutaDelDia(otro);
    if (!r || !r.id) throw new Error('no se pudo preparar la ruta del ' + nom);
    await actualizar(`pedidos?id=eq.${id}`, { ruta_id: r.id });
    await cargarTodo();
    listo('Movido', `${p.emp} pasó al ${nom}`, null);
  } catch (e) {
    av('aviso-global', 'No se pudo mover: ' + esc(e.message), 'rojo');
  }
}

async function quitarParada(id) {
  const p = pedidos.find(x => String(x.id) === String(id));
  if (!p) return av('aviso-global', 'No encuentro ese pedido. Actualiza.', 'rojo');
  if (p.estado === 'en-ruta' || p.estado === 'entregado')
    return av('aviso-global', 'Ese pedido ya se cargó: el stock ya salió de bodega. ' +
      'Avisa a la oficina para corregirlo.', 'naranjo');
  if (!confirm(`¿Sacar a ${p.emp} del camión?\n\nVuelve a quedar en "Asignar".`)) return;
  try {
    await actualizar(`pedidos?id=eq.${id}`, { ruta_id: null });
    await cargarTodo();
    listo('Sacado del camión', 'Vuelve a estar en Asignar', null);
  } catch (e) {
    av('aviso-global', 'No se pudo sacar: ' + esc(e.message), 'rojo');
  }
}

async function crearRuta(camion) {
  try {
    await crear('bod_rutas', [{
      fecha: diaSel, camion, bodega_id: miBodega.id, estado: 'en_bodega'
    }]);
    await cargarTodo();
    listo('Ruta creada', 'Ahora agrégale pedidos', null);
  } catch (e) {
    av('aviso-global', 'No se pudo crear la ruta: ' + esc(e.message), 'rojo');
  }
}

async function guardarChofer(rutaId, nombre) {
  try { await actualizar(`bod_rutas?id=eq.${rutaId}`, { chofer: nombre.trim() }); }
  catch (e) { av('aviso-global', 'No se pudo guardar el chofer: ' + esc(e.message), 'rojo'); }
}

async function marcar(id, estado) {
  const p = pedidos.find(x => String(x.id) === String(id));
  if (!p) return;
  if (!sePuedeTocar(p))
    return av('aviso-global',
      'Ese pedido todavía no está facturado. La oficina lo factura y ahí lo puedes mover.',
      'naranjo');
  try {
    await actualizar(`pedidos?id=eq.${id}`, { estado });
    await cargarTodo();
  } catch (e) {
    av('aviso-global', 'No se pudo cambiar el estado: ' + esc(e.message), 'rojo');
  }
}

function verParada(id) {
  const p = pedidos.find(x => String(x.id) === String(id));
  if (!p) return;
  // Se lleva a la ruta de su día: ahí está con todo lo demás del viaje.
  const d = diaDe(p);
  if (d) { diaSel = d; cargarTodo(); }
}

// ══════════════════════════════════════════════════════════════
//  ASIGNAR — los pedidos del día que todavía no tienen camión
// ══════════════════════════════════════════════════════════════
function renderAsignar() {
  pintarDias('asig-dias', 'verDiaAsig');
  const cont = document.getElementById('asig-lista');
  if (!cont) return;

  const delDia = pedidos.filter(p => diaDe(p) === diaSel);
  const libres = delDia.filter(p => !p.ruta_id && sePuedeTocar(p));
  // Los que no se pueden tocar se MUESTRAN igual. Esconderlos haría creer que
  // ese día tiene menos trabajo del que tiene, y el bodeguero necesita saber
  // qué viene aunque todavía no pueda moverlo.
  const bloqueados = delDia.filter(p => !p.ruta_id && !sePuedeTocar(p));

  if (!delDia.length) {
    cont.innerHTML = '<div class="tarj"><div class="gris">Nada agendado para ' +
      esc(fechaCorta(diaSel)) + '.</div></div>';
    document.getElementById('asig-acc').style.display = 'none';
    return;
  }

  cont.innerHTML = `
    ${libres.length ? `<div class="tarj">
      <h2>Por asignar</h2>
      <div class="gris" style="margin-bottom:10px">Marca los que van juntos en un camión.</div>
      ${libres.map(p => `<div class="fila" onclick="togAsig(${p.id})"
          style="cursor:pointer">
        <div style="flex:0 0 auto;font-size:22px">${aAsignar.has(p.id) ? '☑️' : '⬜'}</div>
        <div class="fila-n">${esProduccion(p) ? '🏭 ' : ''}${esc(p.emp)}
          <div class="gris" style="font-size:14px">${esc(p.dir || 'sin dirección')}</div>
          <div class="gris" style="font-size:14px">${esc(p.detalle || '')}</div>
        </div>
      </div>`).join('')}
    </div>` : '<div class="tarj"><div class="gris">Todos los pedidos de este día ' +
      'ya están en un camión.</div></div>'}

    ${bloqueados.length ? `<div class="tarj" style="opacity:.7">
      <h2>Todavía sin facturar</h2>
      <div class="gris" style="margin-bottom:10px">
        Los puedes ver, pero no moverlos hasta que la oficina los facture.
      </div>
      ${bloqueados.map(p => `<div class="fila">
        <div class="fila-n">${esc(p.emp)}
          <div class="gris" style="font-size:14px">${esc(p.dir || '')}</div></div>
        <span class="marca m-gris">esperando factura</span>
      </div>`).join('')}
    </div>` : ''}
  `;
  pintarAccAsig();
}

function verDiaAsig(iso) { diaSel = iso; aAsignar.clear(); cargarTodo(); }

function togAsig(id) {
  if (aAsignar.has(id)) aAsignar.delete(id); else aAsignar.add(id);
  renderAsignar();
}

function pintarAccAsig() {
  const caja = document.getElementById('asig-acc');
  if (!caja) return;
  caja.style.display = aAsignar.size ? 'block' : 'none';
  const e = document.getElementById('asig-sel');
  if (e) e.textContent = `${aAsignar.size} pedido(s) marcado(s)`;
}

// Asigna lo marcado al camión, creando la ruta del día si no existe.
async function asignarA(camion) {
  if (!aAsignar.size) return;
  let r = rutas.find(x => x.fecha === diaSel && x.camion === camion);
  try {
    if (!r) {
      const resp = await crear('bod_rutas', [{
        fecha: diaSel, camion, bodega_id: miBodega.id, estado: 'en_bodega'
      }]);
      const d = await resp.json();
      r = Array.isArray(d) ? d[0] : d;
      if (!r || !r.id) throw new Error('no se pudo crear la ruta');
    }
    let bien = 0; const mal = [];
    for (const id of aAsignar) {
      try { await actualizar(`pedidos?id=eq.${id}`, { ruta_id: r.id }); bien++; }
      catch (_) { mal.push(id); }
    }
    aAsignar.clear();
    await cargarTodo();
    listo(`${bien} al ${camion === 'camion-1' ? 'Camión 1' : 'Camión 2'}`,
      mal.length ? `${mal.length} no se pudieron` : '', null);
  } catch (e) {
    av('asig-aviso', 'No se pudo asignar: ' + esc(e.message), 'rojo');
  }
}

// ══════════════════════════════════════════════════════════════
//  STOCK
// ══════════════════════════════════════════════════════════════
//
// El color se calcula contra lo que se VENDE, no contra un mínimo escrito a
// mano. Es el mismo criterio que usa el panel: un producto que se vende 10
// por semana se pone rojo con 5 en bodega.
const VENTANA = 60;   // días que se miran para estimar el consumo

function consumoSemanal(prodId) {
  // Se estima desde las salidas de venta del período. Sin salidas no hay con
  // qué medir, y decir "está bien" de algo que nadie midió sería inventar
  // tranquilidad.
  const venta = new Set(motivos.filter(m => m.es_venta).map(m => String(m.id)));
  const d = new Date(); d.setDate(d.getDate() - VENTANA);
  const desde = aISO(d);
  let total = 0;
  for (const m of movs) {
    if (m.tipo !== 'salida' || !venta.has(String(m.motivo_id))) continue;
    if (String(m.producto_id) !== String(prodId)) continue;
    if (String(m.fecha).slice(0,10) < desde) continue;
    total += aBase(m.producto_id, Math.abs(Number(m.cantidad) || 0), m.medida);
  }
  return total / (VENTANA / 7);
}

function colorStock(saldo, semanal) {
  if (saldo <= 0) return { c: 'b-rojo', t: 'Agotado' };
  if (!(semanal > 0)) return { c: 'b-gris', t: 'Sin movimiento' };
  const sem = saldo / semanal;
  if (sem <= 0.5) return { c: 'b-rojo',     t: 'Menos de media semana' };
  if (sem < 1)    return { c: 'b-naranjo',  t: 'Menos de una semana' };
  if (sem < 2)    return { c: 'b-amarillo', t: 'Menos de dos semanas' };
  return { c: 'b-verde', t: 'Con holgura' };
}

function filtrarStock(f) {
  filtroStock = (filtroStock === f) ? '' : f;
  ['todo','frio','seco','poco'].forEach(k => {
    const b = document.getElementById('f-' + k);
    if (b) b.className = 'chip-f' +
      ((k === 'todo' && !filtroStock) || k === filtroStock ? ' on' : '');
  });
  renderStock();
}

function renderStock() {
  const cont = document.getElementById('stock-lista');
  if (!cont) return;
  const q = (document.getElementById('stock-q').value || '').trim().toLowerCase();

  let lista = productos.slice();
  if (filtroStock === 'frio') lista = lista.filter(p => p.congelado);
  if (filtroStock === 'seco') lista = lista.filter(p => !p.congelado);
  if (q) lista = lista.filter(p =>
    (p.nombre + ' ' + (p.formato || '')).toLowerCase().includes(q));

  const filas = lista.map(p => {
    const s = saldoDe(p.id);
    const sem = consumoSemanal(p.id);
    return { p, s, sem, col: colorStock(s, sem) };
  });

  const ver = filtroStock === 'poco'
    ? filas.filter(x => x.col.c === 'b-rojo' || x.col.c === 'b-naranjo')
    : filas;

  if (!ver.length) {
    cont.innerHTML = '<div class="tarj"><div class="gris">Nada que mostrar ' +
      'con este filtro.</div></div>';
    return;
  }

  // Lo que urge arriba: con cuarenta productos, lo que falta no debería
  // estar al final de la lista.
  const orden = { 'b-rojo': 0, 'b-naranjo': 1, 'b-amarillo': 2, 'b-verde': 3, 'b-gris': 4 };
  ver.sort((a, b) => orden[a.col.c] - orden[b.col.c]);

  cont.innerHTML = '<div class="tarj">' + ver.map(x => `
    <div class="prod-f">
      <div class="semaforo ${x.col.c}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:16px;line-height:1.3">
          ${x.p.congelado ? '❄️ ' : ''}${esc(x.p.nombre)}</div>
        <div class="gris" style="font-size:14px">${esc(x.p.formato || '')}
          ${x.sem > 0 ? ` · se van ~${num(Math.round(x.sem))} por semana` : ''}</div>
        <div class="gris" style="font-size:13px">${esc(x.col.t)}</div>
      </div>
      <div style="text-align:right;flex:0 0 auto">
        <div style="font-size:22px;font-weight:900">${num(x.s)}</div>
        <div class="gris" style="font-size:12px">${esc(x.p.unidad || 'un')}</div>
      </div>
      <button class="b b-gris b-chico" style="width:auto;flex:0 0 auto;padding:10px 12px"
        onclick="abrirMov(${x.p.id})">Mover</button>
    </div>`).join('') + '</div>';
}


// ══════════════════════════════════════════════════════════════
//  CARGAR AL CAMIÓN — acá se descuenta el stock
// ══════════════════════════════════════════════════════════════
//
// Marcar "en ruta" sin descontar dejaría el inventario diciendo que hay
// producto que ya va en la carretera, y alguien en la oficina lo prometería.
//
// Se descuenta al CARGAR y no al entregar: el producto sale de la bodega
// cuando sube al camión, no cuando llega al cliente.
let cgPed = null, cgLineas = [];

const RE_LINEA = /^(.*?)\s*\(([^)]*)\)\s*[x×]\s*([\d.,]+)\s*(cajas?|un|unidades?)?\s*$/i;
const normTxt = t => String(t || '').toLowerCase().trim().replace(/\s+/g, ' ');

function prepararLineas(p) {
  const out = [], fuera = [];
  String(p.detalle || '').split(/,\s*(?=[A-ZÁÉÍÓÚÑ])/).map(x => x.trim()).filter(Boolean)
    .forEach(it => {
      const m = it.match(RE_LINEA);
      const nombre = m ? m[1].trim() : it;
      const fmt = m ? m[2].trim() : '';
      const cant = m ? Number(String(m[3]).replace(',', '.')) || 0 : 0;
      const med = m && (m[4] || '').toLowerCase().startsWith('un') ? 'unidad' : 'caja';
      let pr = productos.find(x => normTxt(x.nombre) === normTxt(nombre) &&
                                   normTxt(x.formato || '') === normTxt(fmt));
      if (!pr) pr = productos.find(x => normTxt(x.nombre) === normTxt(nombre));
      // Una línea de muestra sale igual de bodega: lo que cambia es que no se
      // cobra, y eso lo decidió la oficina al crear el pedido.
      const esMuestra = /\[muestra\]/i.test(it);
      if (!pr || !(cant > 0)) { fuera.push(it); return; }
      out.push({ producto_id: pr.id, pedida: cant, cantidad: cant,
                 medida: med, muestra: esMuestra, pistoleada: false });
    });
  return { out, fuera };
}

function abrirCarga(id) {
  const p = pedidos.find(x => String(x.id) === String(id));
  if (!p) return;
  if (!sePuedeTocar(p) && esVentaB(p))
    return av('aviso-global', 'Ese pedido todavía no está facturado.', 'naranjo');

  const r = prepararLineas(p);
  cgPed = p; cgLineas = r.out;
  // Si ya se había anotado, se parte de eso y no de lo que dice el pedido.
  if (Array.isArray(p.carga) && p.carga.length) {
    cgLineas = p.carga.map(l => ({
      producto_id: l.producto_id, pedida: Number(l.pedida != null ? l.pedida : l.cantidad) || 0,
      cantidad: Number(l.cantidad) || 0, medida: l.medida === 'unidad' ? 'unidad' : 'caja',
      muestra: !!l.muestra, pistoleada: true }));
  }

  document.getElementById('cg-title').textContent = p.emp;
  document.getElementById('cg-alert').innerHTML = '';
  document.getElementById('cg-ficha').innerHTML =
    `${esc(p.dir || 'sin dirección')}` +
    (p.factura_num ? `<br>🧾 Factura ${esc(p.factura_num)}` : '') +
    (r.fuera.length
      ? `<br><b>Ojo:</b> ${r.fuera.length} línea(s) que no reconozco. Súbelas ` +
        'igual y avisa a la oficina.'
      : '');
  document.getElementById('cg-ean').value = '';
  pistolaMsg('', 'Si no tienes pistola, ajusta los números abajo con + y −');
  pintarLineasCarga();
  abrir('mod-carga');
  setTimeout(() => document.getElementById('cg-ean').focus(), 80);
}

function pintarLineasCarga() {
  const cont = document.getElementById('cg-lineas');
  if (!cgLineas.length) {
    cont.innerHTML = '<div class="aviso a-naranjo">No reconozco nada de este ' +
      'pedido. Cárgalo igual y avisa a la oficina.</div>';
    document.getElementById('b-cg').disabled = true;
    return;
  }
  document.getElementById('b-cg').disabled = false;
  cont.innerHTML = cgLineas.map((l, i) => `<div class="fila">
    <div class="fila-n">${esc(nombreProd(l.producto_id))}
      ${l.muestra ? '<span class="marca m-naranjo">muestra</span>' : ''}
      <div class="gris" style="font-size:14px">piden ${num(l.pedida)}
        ${l.medida === 'caja' ? 'cajas' : 'un'}</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex:0 0 auto">
      <button class="b b-gris b-chico" style="width:48px;padding:10px"
        onclick="cgChg(${i},-1)">−</button>
      <div class="fila-c" style="min-width:38px;text-align:center">${num(l.cantidad)}</div>
      <button class="b b-gris b-chico" style="width:48px;padding:10px"
        onclick="cgChg(${i},1)">+</button>
    </div>
  </div>`).join('');
  pintarDifCarga();
}

function cgChg(i, d) {
  if (!cgLineas[i]) return;
  cgLineas[i].cantidad = Math.max(0, cgLineas[i].cantidad + d);
  cgLineas[i].pistoleada = true;
  pintarLineasCarga();
}

function pintarDifCarga() {
  const difs = cgLineas.map(l => ({ l, d: l.cantidad - l.pedida }))
                       .filter(x => Math.abs(x.d) > 0.001);
  document.getElementById('cg-dif').innerHTML = difs.length
    ? `<div class="dif">Sale distinto a lo que pidieron:<br>` +
      difs.map(x => `· ${esc(nombreProd(x.l.producto_id))}: piden ${num(x.l.pedida)},
        subes ${num(x.l.cantidad)}`).join('<br>') +
      '<br><br>Está bien si es así. La oficina lo va a ver.</div>'
    : '';
}

// ── pistoleo ──
//
// La pistola se comporta como un teclado: escribe los dígitos y manda Enter.
// Sin librerías ni permiso de cámara, y funciona con guantes.
//
// Cada producto tiene dos códigos, el de la caja y el de la unidad: eso evita
// preguntarle qué escaneó. Lo dice el código.
function ean13Valido(p) {
  const v = String(p || '').replace(/[^0-9]/g, '');
  if (v.length !== 13) return false;
  let s = 0;
  for (let i = 1; i <= 12; i++) s += Number(v[i - 1]) * (i % 2 === 0 ? 3 : 1);
  return ((10 - (s % 10)) % 10) === Number(v[12]);
}
function porCodigo(cod) {
  const v = String(cod || '').replace(/[^0-9]/g, '');
  if (!v) return null;
  const c = productos.find(p => p.ean_caja && p.ean_caja === v);
  if (c) return { producto: c, medida: 'caja' };
  const u = productos.find(p => p.ean && p.ean === v);
  if (u) return { producto: u, medida: 'unidad' };
  return null;
}
function pistolaMsg(clase, msg) {
  const c = document.querySelector('.pistola');
  if (c) c.className = 'pistola' + (clase ? ' ' + clase : '');
  const m = document.getElementById('cg-ean-msg');
  if (m) m.innerHTML = msg;
  clearTimeout(pistolaMsg._t);
  pistolaMsg._t = setTimeout(() => {
    const x = document.querySelector('.pistola');
    if (x) x.className = 'pistola';
  }, 2500);
}
function leerCodigo() {
  const campo = document.getElementById('cg-ean');
  const cod = String(campo.value || '').replace(/[^0-9]/g, '');
  campo.value = ''; campo.focus();
  if (!cod || !cgPed) return;

  if (!ean13Valido(cod))
    return pistolaMsg('mal', '❌ No se leyó bien. Pásalo otra vez.');
  const hit = porCodigo(cod);
  if (!hit)
    return pistolaMsg('mal', '❓ Este código no lo conozco.<br>Súbelo igual y avisa.');
  const i = cgLineas.findIndex(l => String(l.producto_id) === String(hit.producto.id));
  if (i < 0)
    return pistolaMsg('mal', `⚠️ <b>${esc(hit.producto.nombre)}</b> no va en este pedido.`);

  const l = cgLineas[i];
  const suma = hit.medida === l.medida ? 1
             : hit.medida === 'caja'   ? factorDe(l.producto_id)
             : 1 / factorDe(l.producto_id);
  // El primer escaneo parte de cero: se cuenta lo que sube, no se suma sobre
  // lo que decía el pedido.
  if (!l.pistoleada) { l.cantidad = 0; l.pistoleada = true; }
  l.cantidad = Math.round((l.cantidad + suma) * 100) / 100;
  pistolaMsg('ok', `✔ ${esc(hit.producto.nombre)} · llevas ${num(l.cantidad)} de ${num(l.pedida)}`);
  pintarLineasCarga();
  document.getElementById('cg-ean').focus();
}

async function confirmarCarga() {
  if (!cgPed) return;
  const utiles = cgLineas.filter(l => l.cantidad > 0);
  if (!utiles.length) return av('cg-alert', 'No anotaste ninguna cantidad.', 'rojo');

  const btn = document.getElementById('b-cg');
  btn.innerHTML = '<span class="sp"></span>Guardando...'; btn.disabled = true;
  try {
    // Se anota lo que sube. El stock se descuenta cuando se marque «Salió».
    const carga = utiles.map(l => ({ producto_id: l.producto_id, cantidad: l.cantidad,
      medida: l.medida, muestra: !!l.muestra, pedida: l.pedida }));
    await actualizar(`pedidos?id=eq.${cgPed.id}`, { carga, cargado_en: new Date().toISOString() });
    cgPed.carga = carga;
    cerrar('mod-carga');
    cgPed = null;
    repintar();
    listo('Anotado', 'El stock se descuenta cuando marques «Salió»', null);
  } catch (e) {
    av('cg-alert', '<b>No se pudo guardar.</b> ' + esc(e.message) + '<br>Puedes reintentar.', 'rojo');
  }
  btn.innerHTML = 'Listo, ya subió al camión'; btn.disabled = false;
}

// ══════════════════════════════════════════════════════════════
//  v64 · POR SALIR · EN RUTA · CERRADAS
// ══════════════════════════════════════════════════════════════
// Las rutas las arma y publica la oficina. Bodega las recibe, carga cada
// pedido, marca si el camión salió y, cuando vuelve, qué se entregó.
//
// El stock se descuenta al marcar «Salió», no al cargar: un camión que no
// sale no deja el inventario corto. Lo que vuelve —no salió, no subió o no
// se entregó— queda marcado como devuelto y la oficina decide qué hacer.
let vistaRuta = null;      // { id, modo: 'cargar' | 'vuelta' }
let conMov = new Set();    // pedidos que ya descontaron stock con la forma anterior
let hojaElegido = '';
const MOTIVOS_NO_SALIO   = ['Falta producto', 'Camión con problema', 'Falta chofer', 'Otro motivo'];
const MOTIVOS_NO_ENTREGA = ['Local cerrado', 'El cliente no lo recibió', 'No alcanzó a llegar', 'Dirección equivocada', 'Otro motivo'];

const nomCamion = c => c === 'camion-2' ? 'Camión 2' : 'Camión 1';
const ahoraISO = () => new Date().toISOString();
const horaDe = t => t ? new Date(t).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }) : '';
function sumarDias(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return aISO(d); }
function diaTexto(iso) {
  const f = String(iso || '').slice(0, 10), h = hoyISO();
  if (f === h) return 'Hoy';
  if (f === sumarDias(h, 1)) return 'Mañana';
  if (f === sumarDias(h, -1)) return 'Ayer';
  const d = new Date(f + 'T12:00:00');
  return `${DIAS_C[d.getDay()]} ${d.getDate()}`;
}
const rutaPorId = id => rutas.find(r => String(r.id) === String(id)) || null;
// Las paradas que siguen en la ruta: lo devuelto ya no es de ella.
const paradasDe = r => pedidos.filter(p => String(p.ruta_id) === String(r.id) && !p.devuelto_tipo);
const todosDe   = r => pedidos.filter(p => String(p.ruta_id) === String(r.id));
const entregadoYa = p => p.estado === 'entregado' || p.estado === 'entregado-sin-facturar';
const descontado  = p => conMov.has(String(p.id)) || p.estado === 'en-ruta';
const cargado     = p => descontado(p) || (Array.isArray(p.carga) && p.carga.length > 0);
const esVentaB    = p => !p.tipo || p.tipo === 'venta';
function cajasPed(p) {
  const l = Array.isArray(p.carga) && p.carga.length ? p.carga
    : prepararLineas(p).out.map(x => ({ cantidad: x.pedida, medida: x.medida }));
  return l.reduce((a, x) => a + (x.medida === 'unidad' ? 0 : Number(x.cantidad) || 0), 0);
}
const bodegaDeRuta = r => (r && r.bodega_id) || (miBodega && miBodega.id);
// Una ruta publicada sigue «por salir» si le queda algo por entregar. Las
// rutas de antes de la v64 quedaban publicadas para siempre aunque todo se
// hubiera entregado: esas no se muestran.
const porSalir = r => r.estado === 'en_bodega' &&
  (!todosDe(r).length || paradasDe(r).some(p => !entregadoYa(p)));

function pintarContadores() {
  const hoy = hoyISO();
  const nS = rutas.filter(r => porSalir(r) && String(r.fecha).slice(0, 10) <= hoy).length;
  const nR = rutas.filter(r => r.estado === 'cargada').length;
  const a = document.getElementById('n-salir'), b = document.getElementById('n-ruta');
  if (a) { a.textContent = nS; a.classList.toggle('on', nS > 0); }
  if (b) { b.textContent = nR; b.classList.toggle('on', nR > 0); }
}

function tarjetaRuta(r, boton, apagada) {
  const ps = paradasDe(r);
  const est = { en_bodega: ['est-listo', 'Por salir'], cargada: ['est-mov', 'En ruta'],
    cerrada: r.resultado === 'no-salio' ? ['est-mal', 'No salió'] : ['est-ok', 'Cerrada'] }[r.estado] || ['est-listo', r.estado];
  return `<div class="tarj"${apagada ? ' style="opacity:.8"' : ''}>
    <div class="ruta-cab"><div><h2>🚚 ${nomCamion(r.camion)}</h2>
      <div class="gris">${esc(diaTexto(r.fecha))} · ${r.chofer ? esc(r.chofer) : '<b style="color:var(--naranjo)">sin chofer</b>'}${
        r.estado === 'cargada' && r.salio_en ? ' · salió ' + horaDe(r.salio_en) : ''}</div></div>
      <span class="est ${est[0]}">${est[1]}</span></div>
    <div class="cifras"><div><b>${ps.length}</b><span>paradas</span></div>
      <div><b>${ps.reduce((a, p) => a + cajasPed(p), 0)}</b><span>cajas</span></div>
      <div><b>${ps.filter(cargado).length}</b><span>cargados</span></div></div>
    ${r.notas ? `<div class="aviso a-mora" style="margin-bottom:12px">💬 <b>Oficina:</b> ${esc(r.notas)}</div>` : ''}
    ${boton || ''}
  </div>`;
}

// ── Por salir ──
function renderPorSalir() {
  const cont = document.getElementById('salir-cont');
  if (!cont) return;
  if (vistaRuta && vistaRuta.modo === 'cargar') return renderCargar(cont);
  const hoy = hoyISO();
  const pub = rutas.filter(porSalir);
  const atr = pub.filter(r => String(r.fecha).slice(0, 10) < hoy);
  const deHoy = pub.filter(r => String(r.fecha).slice(0, 10) === hoy);
  const prox = pub.filter(r => String(r.fecha).slice(0, 10) > hoy);
  const lotHoy = lotes.filter(x => String(x.fecha_retiro).slice(0, 10) === hoy);
  let h = '';
  if (lotHoy.length) h += `<div class="tarj" style="border:3px solid var(--am)">
    <h2>🏭 Retiros en la sala hoy</h2>
    ${lotHoy.map(l => `<div class="fila"><div class="fila-n">📥 ${esc(nombreProd(l.producto_id))}
      <div class="gris" style="font-size:14px">${num(l.declarada)} ${l.medida === 'caja' ? 'cajas' : 'un'} · ${
        l.turno === 'manana' ? '☀️ mañana' : '🌙 tarde'}</div></div></div>`).join('')}
  </div>`;
  const btn = r => `<button class="b b-mora" style="margin:0" onclick="abrirVista(${r.id},'cargar')">📦 Cargar el ${nomCamion(r.camion)}</button>`;
  if (atr.length) h += '<div class="seccion-t">Atrasadas</div>' + atr.map(r => tarjetaRuta(r, btn(r))).join('');
  h += '<div class="seccion-t">Hoy</div>' + (deHoy.length ? deHoy.map(r => tarjetaRuta(r, btn(r))).join('')
    : `<div class="tarj"><div class="gris">${pub.length ? 'Hoy no hay más camiones por salir.'
        : 'No hay rutas publicadas. Cuando la oficina publique una, aparece aquí.'}</div></div>`);
  if (prox.length) h += '<div class="seccion-t">Próximos días</div>' + prox.map(r => tarjetaRuta(r,
    `<button class="b b-gris" style="margin:0" onclick="abrirVista(${r.id},'cargar')">Ver qué lleva</button>`, true)).join('');
  cont.innerHTML = h;
}

function abrirVista(id, modo) { vistaRuta = { id, modo }; repintar(); window.scrollTo({ top: 0 }); }
function cerrarVista() { vistaRuta = null; repintar(); window.scrollTo({ top: 0 }); }

function lineasTxt(p) {
  if (Array.isArray(p.carga) && p.carga.length)
    return p.carga.map(l => `<div class="ped-item">· <b>${num(l.cantidad)}</b> ${l.medida === 'unidad' ? 'un.' : 'cajas'} · ${esc(nombreProd(l.producto_id))}</div>`).join('');
  return (p.detalle || '').split(/,\s*(?=[A-ZÁÉÍÓÚÑ])/).filter(Boolean)
    .map(d => `<div class="ped-item">· ${esc(d.trim())}</div>`).join('') || '<div class="ped-item">Sin detalle</div>';
}

function renderCargar(cont) {
  const r = rutaPorId(vistaRuta.id);
  if (!r) { vistaRuta = null; return renderPorSalir(); }
  const ps = paradasDe(r).filter(p => !entregadoYa(p));
  const listos = ps.filter(cargado).length;
  // Total a cargar por producto: sirve para armar el pallet.
  const tot = new Map();
  ps.forEach(p => {
    const ls = Array.isArray(p.carga) && p.carga.length ? p.carga
      : prepararLineas(p).out.map(x => ({ producto_id: x.producto_id, cantidad: x.pedida, medida: x.medida }));
    ls.forEach(l => { const k = l.producto_id + '|' + l.medida; tot.set(k, (tot.get(k) || 0) + (Number(l.cantidad) || 0)); });
  });
  let h = `<div class="vista-cab"><button class="b b-gris" onclick="cerrarVista()">← Volver</button>
    <div><h2>Cargar el ${nomCamion(r.camion)}</h2><div class="gris">${esc(diaTexto(r.fecha))} · ${esc(r.chofer || 'sin chofer')}</div></div></div>`;
  if (r.notas) h += `<div class="aviso a-mora">💬 <b>Nota de la oficina:</b> ${esc(r.notas)}</div>`;
  if (String(r.fecha).slice(0, 10) > hoyISO())
    h += '<div class="aviso a-mora">Esta ruta sale otro día. Puedes ir preparando la carga; «Salió» se marca el día que sale.</div>';
  if (tot.size) h += `<div class="seccion-t">Total a cargar</div><div class="tarj totales">${[...tot.entries()].map(([k, v]) => {
    const [pid, med] = k.split('|');
    return `<div class="fila"><div class="fila-n">${esc(nombreProd(pid))}</div><div class="fila-c">${num(v)}<small>${med === 'unidad' ? 'un.' : 'cajas'}</small></div></div>`;
  }).join('')}</div>`;
  h += `<div class="seccion-t">Paradas en orden · ${listos} de ${ps.length} cargadas</div>`;
  h += ps.map((p, i) => {
    const puede = sePuedeTocar(p) || !esVentaB(p), ok = cargado(p);
    let pie;
    if (descontado(p)) pie = '<div class="res-linea ok"><span>✔ Ya cargado · stock descontado</span></div>';
    else if (ok) pie = `<div class="res-linea ok"><span>✔ Subió</span><span>
        <button class="enlace" onclick="abrirCarga(${p.id})">Cambiar</button>
        <button class="enlace" style="color:var(--rojo)" onclick="quitarCarga(${p.id})">No sube</button></span></div>`;
    else if (!puede) pie = '<div class="res-linea" style="color:var(--naranjo)">🧾 Esperando factura: no se puede cargar todavía</div>';
    else pie = `<button class="b b-mora b-chico" style="margin-top:11px" onclick="abrirCarga(${p.id})">📦 Cargar</button>`;
    return `<div class="parada ${ok ? 'cargada' : ''} ${!puede ? 'bloq' : ''} ${esProduccion(p) ? 'urge' : ''}">
      <div style="display:flex;gap:4px;align-items:flex-start"><div class="parada-n">${i + 1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:900;font-size:17px;line-height:1.25">${esc(p.emp)}</div>
          <div class="gris">📍 ${esc(p.dir || 'sin dirección')}</div>
          <div class="gris">${p.factura_num ? '🧾 Factura ' + esc(p.factura_num)
            : esProduccion(p) ? '🏭 Producción · sin factura' : (esVentaB(p) ? '' : '🎁 Sin cobro')}</div>
        </div></div>
      <div class="ped-items" style="margin-top:10px">${lineasTxt(p)}</div>
      ${pie}
    </div>`;
  }).join('') || '<div class="tarj"><div class="gris">Esta ruta no tiene paradas.</div></div>';
  cont.innerHTML = h;
}

async function quitarCarga(id) {
  const p = pedidos.find(x => String(x.id) === String(id));
  if (!p || !confirm(`¿${p.emp} no sube al camión?\n\nSi el camión sale sin él, vuelve a la oficina.`)) return;
  try {
    await actualizar(`pedidos?id=eq.${id}`, { carga: null, cargado_en: null });
    p.carga = null; repintar();
  } catch (e) { av('aviso-global', 'No se pudo cambiar: ' + esc(e.message), 'rojo'); }
}

// ── La barra de abajo de la carga y de la vuelta ──
function pintarBarraAccion() {
  const ab = document.getElementById('barra-accion');
  if (!ab) return;
  const r = vistaRuta ? rutaPorId(vistaRuta.id) : null;
  let h = '';
  if (r && vistaRuta.modo === 'cargar') {
    if (String(r.fecha).slice(0, 10) > hoyISO()) {
      h = `<div class="barra-accion una"><button class="b b-gris" onclick="cerrarVista()">← Volver a Por salir</button></div>`;
    } else {
      const ps = paradasDe(r).filter(p => !entregadoYa(p));
      const n = ps.filter(cargado).length;
      h = `<div class="barra-accion"><button class="b b-problema" onclick="pedirNoSalio(${r.id})">✕ No salió</button>
        <button class="b b-mora" onclick="pedirSalio(${r.id})" ${n ? '' : 'disabled'}>🚚 Salió<small>${n} de ${ps.length} cargados</small></button></div>`;
    }
  } else if (r && vistaRuta.modo === 'vuelta') {
    const ps = paradasDe(r).filter(p => !entregadoYa(p));
    const m = marcasVuelta(r.id);
    const faltan = ps.filter(p => !m[p.id]).length;
    h = `<div class="barra-accion una"><button class="b b-mora" onclick="pedirCerrarRuta(${r.id})" ${faltan ? 'disabled' : ''}>
      ✔ Cerrar la ruta<small>${faltan ? 'Faltan ' + faltan + ' por marcar' : 'Todo marcado'}</small></button></div>`;
  }
  ab.innerHTML = h;
  document.body.classList.toggle('con-accion', !!h);
}

// ── Hoja de confirmación ──
function hoja(html) { document.getElementById('hoja-cuerpo').innerHTML = html; abrir('mod-hoja'); }
function cerrarHoja() { cerrar('mod-hoja'); }
function hojaMotivos(titulo, extra, motivos, accion) {
  hojaElegido = '';
  hoja(`<h3>${esc(titulo)}</h3>${extra ? `<div class="gris" style="margin-bottom:12px">${extra}</div>` : ''}
    ${motivos.map(m => `<button class="opcion" onclick="elegirMotivo(this, '${esc(m)}')">${esc(m)}</button>`).join('')}
    <button class="b b-mora" id="hoja-ok" disabled onclick="${accion}">Confirmar</button>
    <button class="b b-gris" onclick="cerrarHoja()">Cancelar</button>`);
}
function elegirMotivo(btn, m) {
  hojaElegido = m;
  document.querySelectorAll('#hoja-cuerpo .opcion').forEach(b => b.classList.toggle('on', b === btn));
  document.getElementById('hoja-ok').disabled = false;
}

// ── Salió ──
function pedirSalio(id) {
  const r = rutaPorId(id); if (!r) return;
  const ps = paradasDe(r).filter(p => !entregadoYa(p));
  const suben = ps.filter(cargado), quedan = ps.filter(p => !cargado(p));
  const aDescontar = suben.filter(p => !descontado(p));
  const cajas = aDescontar.reduce((a, p) => a + cajasPed(p), 0);
  hoja(`<h3>¿Salió el ${nomCamion(r.camion)}?</h3>
    <div class="aviso a-verde">✔ Suben ${suben.length} parada${suben.length === 1 ? '' : 's'}.</div>
    ${aDescontar.length ? `<div class="aviso a-mora">📦 Se descuentan ${num(cajas)} cajas de ${esc(nombreBodegaB(bodegaDeRuta(r)))}.</div>` : ''}
    ${quedan.length ? `<div class="aviso a-naranjo">↩️ No subió: ${quedan.map(p => esc(p.emp)).join(', ')}. Vuelve a la oficina para que decida.</div>` : ''}
    <button class="b b-mora" id="hoja-ok" onclick="confirmarSalio(${r.id})">🚚 Sí, salió</button>
    <button class="b b-gris" onclick="cerrarHoja()">Volver</button>`);
}
function nombreBodegaB(id) { const b = bodegas.find(x => String(x.id) === String(id)); return b ? b.nombre : 'la bodega'; }

async function confirmarSalio(id) {
  const r = rutaPorId(id); if (!r) return;
  const ok = document.getElementById('hoja-ok');
  ok.innerHTML = '<span class="sp"></span>Guardando...'; ok.disabled = true;
  const ps = paradasDe(r).filter(p => !entregadoYa(p));
  const suben = ps.filter(cargado), quedan = ps.filter(p => !cargado(p));
  const salidas = motivos.filter(m => m.activo && m.tipo === 'salida');
  const venta = salidas.find(m => m.es_venta);
  const sinVenta = salidas.find(m => !m.es_venta && !m.es_perdida);
  const filas = [];
  suben.filter(p => !descontado(p) && Array.isArray(p.carga)).forEach(p => p.carga.forEach(l => {
    if (!(Number(l.cantidad) > 0)) return;
    // Una línea de muestra o un pedido sin cobro no es venta: lleva su motivo.
    const mot = (l.muestra || !esVentaB(p)) ? (sinVenta || venta) : (venta || sinVenta);
    filas.push({
      tipo: 'salida', fecha: hoyISO(), producto_id: l.producto_id, bodega_id: bodegaDeRuta(r),
      cantidad: Number(l.cantidad), medida: l.medida === 'unidad' ? 'unidad' : 'caja',
      motivo_id: mot ? mot.id : null,
      doc: String(p.factura_num || '').trim() || null, pedido_id: p.id, usuario: quien,
      nota: `Salió en el ${nomCamion(r.camion)} · ${p.emp}` +
        (l.pedida != null && Math.abs(Number(l.cantidad) - Number(l.pedida)) > 0.001
          ? ` · pedían ${num(l.pedida)}, subieron ${num(l.cantidad)}` : '')
    });
  }));
  if (filas.length && !venta && !sinVenta) {
    cerrarHoja();
    return av('aviso-global', 'La oficina no tiene motivos de salida configurados. Avísales antes de marcar «Salió».', 'rojo');
  }
  // El stock PRIMERO. Si falla, no cambió nada y se puede reintentar.
  try { if (filas.length) await crear('bod_movimientos', filas); }
  catch (e) {
    cerrarHoja();
    return av('aviso-global', '<b>No se pudo descontar el stock.</b> ' + esc(e.message) +
      '<br>No cambió nada: puedes volver a marcar «Salió».', 'rojo');
  }
  const malos = [];
  for (const p of suben) if (p.estado !== 'en-ruta') {
    try { await actualizar(`pedidos?id=eq.${p.id}`, { estado: 'en-ruta' }); } catch (_) { malos.push(p.emp); }
  }
  for (const p of quedan) {
    try { await actualizar(`pedidos?id=eq.${p.id}`, { devuelto_tipo: 'no-subio',
      devuelto_motivo: 'No subió al camión', devuelto_en: ahoraISO() }); } catch (_) { malos.push(p.emp); }
  }
  let errRuta = '';
  try { await actualizar(`bod_rutas?id=eq.${r.id}`, { estado: 'cargada', resultado: 'salio', salio_en: ahoraISO() }); }
  catch (e) { malos.push('la ruta'); errRuta = e.message; }
  cerrarHoja();
  vistaRuta = null;
  await cargarTodo();
  if (malos.length) av('aviso-global', 'El stock se descontó, pero no quedó marcado: ' + malos.map(esc).join(', ') +
    (errRuta ? '<br><small>' + esc(errRuta) + '</small>' : '') + '<br>Avisa a la oficina.', 'naranjo');
  ir('ruta');
  listo('Salió el ' + nomCamion(r.camion), filas.length ? 'El stock ya se descontó' : '', null);
}

// ── No salió ──
function pedirNoSalio(id) {

}

  }
